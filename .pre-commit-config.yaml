# See https://pre-commit.com for more information
# Install: uv run pre-commit install
# Run all: uv run pre-commit run --all-files

repos:
  # ---------- General file hygiene ----------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v5.0.0"
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
        # 10 MB: the repo vendors two toolchain tarballs (msvc152.tar.xz,
        # delphi10.tar.xz) so the images build without host files.
        args: [--maxkb=10240]
      - id: debug-statements
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix=lf]

  # ---------- Local tools (use uv-managed versions) ----------
  - repo: local
    hooks:
      - id: skills-ref
        name: Validate Agent Skills
        # The skills-ref package exposes the `agentskills` binary; the old
        # hook checked for a nonexistent `skills-ref` command and silently
        # exited 0, so a broken SKILL.md passed CI (infra-review F6).
        entry: bash -c 'for f in "$@"; do uv run agentskills validate "$f" || exit 1; done' --
        language: system
        pass_filenames: true
        # Only actual SKILL.md files — the broader dir pattern matched
        # references/*.md too, which agentskills validate rejects ("Not a
        # directory"), failing `pre-commit run --all-files` (CI) on a
        # valid tree.
        files: ^src/rebrew/agent-skills/[^/]+/SKILL\.md$

      - id: ruff-check
        name: Ruff Lint
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff Format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: import-cycles
        name: Detect module-level import cycles
        entry: uv run python tools/detect_cycles.py
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: Mypy type check
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest (fast)
        entry: uv run pytest tests/ -q --tb=short
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: validate-skill-commands
        name: Validate SKILL.md command lines
        entry: uv run python tools/validate_skill_commands.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

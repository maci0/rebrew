# See https://pre-commit.com for more information
# Install: uv run --frozen pre-commit install
# Run all: uv run --frozen pre-commit run --all-files

# `default_install_hook_types` is what makes plain `pre-commit install`
# (`make setup`) install the pre-push hook. Without this key only the
# pre-commit type is installed, and the pytest hook below never runs.
# Skip it for one push with `SKIP=pytest git push`.
default_install_hook_types: [pre-commit, pre-push]

repos:
  # ---------- General file hygiene ----------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # frozen: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
        # 8 MB: headroom over the largest tracked file (docs/codegen/corpus.json,
        # ~3.8 MB) while still blocking an accidental toolchain tarball or target
        # binary.  The tools/msvc*.tar.gz media this limit used to accommodate is
        # gitignored (.gitignore) and lives in the sibling rebrew-toolchains repo.
        args: [--maxkb=8192]
      - id: debug-statements
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix=lf]

  # ---------- Local tools (use uv-managed versions) ----------
  - repo: local
    hooks:
      - id: skills-ref
        name: Validate Agent Skills
        # The skills-ref package exposes the `agentskills` binary; the old
        # hook checked for a nonexistent `skills-ref` command and silently
        # exited 0, so a broken SKILL.md passed CI.
        entry: bash -c 'for f in "$@"; do uv run --frozen agentskills validate "$f" || exit 1; done' --
        language: system
        pass_filenames: true
        # Only actual SKILL.md files — the broader dir pattern matched
        # references/*.md too, which agentskills validate rejects ("Not a
        # directory"), failing `pre-commit run --all-files` (CI) on a
        # valid tree.
        files: ^src/rebrew/agent-skills/[^/]+/SKILL\.md$

      - id: ruff-check
        name: Ruff Lint
        entry: uv run --frozen ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff Format
        entry: uv run --frozen ruff format
        language: system
        types: [python]

      - id: import-cycles
        name: Detect module-level import cycles
        entry: uv run --frozen python tools/detect_cycles.py
        language: system
        pass_filenames: false
        always_run: true

      - id: import-layering
        name: Detect wrong-direction imports
        entry: uv run --frozen python tools/check_layering.py
        language: system
        pass_filenames: false
        always_run: true

      # Shell is the repo's only non-Python source language (the resembl
      # clone helper both workflows call).  CI installs shellcheck before
      # `make check`, so the gate is blocking there; a contributor without
      # it on PATH skips instead of failing a commit they cannot fix.
      - id: shellcheck
        name: ShellCheck
        entry: bash -c 'command -v shellcheck >/dev/null 2>&1 || exit 0; exec shellcheck "$@"' --
        language: system
        types: [shell]

      # `check-yaml` above proves the tracked YAML parses; this proves it is
      # well-formed (tabs, trailing spaces, duplicate keys, a malformed
      # `run:` block).  --strict makes a warning fail the hook, so the one
      # file that cannot pass is excluded in .yamllint.yml instead of the
      # whole tree losing the severity.  Same skip-if-absent shape as
      # shellcheck, and the CI pre-commit job installs yamllint alongside it.
      - id: yamllint
        name: yamllint
        entry: bash -c 'command -v yamllint >/dev/null 2>&1 || exit 0; exec yamllint --strict "$@"' --
        language: system
        types: [yaml]

      - id: mypy
        name: Mypy type check
        # `make mypy` first checks the `prove` extra is installed: without it
        # mypy reports ~39 phantom errors (unknown SimProcedure, unused-ignore,
        # import-not-found) that all trace to the missing extra, not the diff.
        entry: make --no-print-directory mypy
        language: system
        pass_filenames: false
        always_run: true

      # `make test` (same as CI) fails without nasm instead of letting the
      # asm round-trip tests skip and pass a push CI would reject.
      - id: pytest
        name: pytest (full suite, make test)
        entry: make --no-print-directory test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: validate-skill-commands
        name: Validate SKILL.md command lines
        # Pre-commit stage, not manual: a manual-stage hook runs from no
        # command the project documents, so `make check` and the CI
        # pre-commit job skipped it and a stale flag in a SKILL.md passed
        # every gate. Files are not passed because the validator scans the
        # whole agent-skills tree itself.
        entry: uv run --frozen python tools/validate_skill_commands.py
        language: system
        pass_filenames: false
        always_run: true

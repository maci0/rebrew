[tool.uv]
package = true

[tool.uv.sources]
# Sibling-checkout path dep (see the `similarity` dependency group): uv resolves
# `resembl` from ../resembl relative to this pyproject.toml, keeping the
# manifest free of machine-specific absolute paths.
resembl = { path = "../resembl" }

[dependency-groups]
dev = [
    "mypy>=2.4.1,<2.5",
    "pytest>=9.2.0,<10",  # CVE-2025-71176 (tmpdir) fixed in 9.0.3; floor tracks lock
    "slipcover>=1.1.0,<2",
    "ruff>=0.17.4,<1",  # floor tracks lock; older minors shipped years-old lint rulesets
    "pre-commit>=4.7.0,<5",
    "hypothesis>=6.170.15,<7",
    "skills-ref>=0.1.1,<0.2",  # the pre-commit "Validate Agent Skills" hook binary
    "pytest-xdist>=3.8.0,<4",  # full-suite workers; tests/pytest_ansi_env.py injects -n auto
]
# Optional code-similarity scoring (rebrew verify "Sim %"): sibling `resembl`
# scoring core + rapidfuzz.  Path-pinned via [tool.uv.sources] — never an
# extra, so wheel METADATA cannot point pip at the unrelated PyPI `resembl`.
# Install: `uv sync --group similarity` (needs ../resembl checked out).
# resembl 5.0.0 declares License-Expression: GPL-3.0-only. See NOTICE.
similarity = [
    "resembl",
    "rapidfuzz>=3.14.6,<4",  # direct import in matcher/scoring.py code_similarity
]
# m2c decompiler backend (decompiler.py fetch_m2c).  Not on PyPI under this
# name (the PyPI `m2c` is an unrelated OpenAPI package) — git-only, so it
# must not appear in optional-dependencies / wheel Requires-Dist.
# Commit-pinned so a floating default branch cannot silently change the
# decompiler; keep in step with the rev recorded in uv.lock.
# Install: `uv sync --group m2c`.
# This commit declares License-Expression: GPL-3.0-only. See NOTICE.
m2c = [
    "m2c @ git+https://github.com/matt-kempster/m2c.git@c632946b8cfbe8fce442b522dba92dfa72f1f317",
]
# Coverage-guided fuzzing (tests/fuzz_lzexe_dfm.py, the libFuzzer entry point
# whose body tests/test_property_obj_symbol.py also drives under Hypothesis).
# Resembl's own `fuzz` extra already carries the same atheris spec through the
# `similarity` group, but rebrew's own harness import must be declared here:
# a dependency that only arrives as a transitive of a sibling path dep is
# invisible to `uv sync --group fuzz` and to the dev-tree import gate.
# The spec mirrors ../resembl exactly: PyPI atheris has no cp315 wheel, so
# the qualified cp315 build is the maci0 fork wheel / sdist, hash-pinned.
# Install: `uv sync --group fuzz`.
fuzz = [
    "atheris @ https://github.com/maci0/atheris/releases/download/atheris-v3.1.0-relumea.2/atheris-3.1.0%2Brelumea.2-cp315-cp315-linux_x86_64.whl#sha256=6a1dd5169f6b9448d204164917da4749706c070efd0053120c22702d6c1dbd9c ; python_version == '3.15' and platform_python_implementation == 'CPython' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "atheris @ https://github.com/maci0/atheris/releases/download/atheris-v3.1.0-relumea.2/atheris-3.1.0%2Brelumea.2.tar.gz#sha256=f68bf1c9b2337df27578c89842eb32da6218efd3427a37ace0982693b907a1c6 ; python_version > '3.15' or python_version == '3.15' and platform_python_implementation != 'CPython' or python_version == '3.15' and platform_python_implementation == 'CPython' and sys_platform != 'linux' or python_version == '3.15' and platform_python_implementation == 'CPython' and sys_platform == 'linux' and platform_machine != 'x86_64'",
]

[tool.mypy]
strict = true
# Zero-finding extras beyond --strict: keep enabled so regressions fail CI.
extra_checks = true
disallow_any_decorated = true
local_partial_types = true
strict_bytes = true
warn_incomplete_stub = true
enable_error_code = [
    "ignore-without-code",
    "unused-awaitable",
    "mutable-override",
    "exhaustive-match",
    "unimported-reveal",
    "truthy-iterable",
    "redundant-self",
    "deprecated",
    "narrowed-type-not-subtype",
    "possibly-undefined",
    "truthy-bool",
    "explicit-override",
    "comparison-overlap",
    "truthy-function",
    "safe-super",
    "overload-cannot-match",
    "unused-coroutine",
    "str-bytes-safe",
]
# src/ is the shipped library; tools/ are the repo's own dev scripts (CI and
# the pre-commit hook both run plain `uv run mypy`, which checks both).  The
# tests/ modules below are the ones that came clean first: the five non-test_
# helper modules (the pytest plugin every run loads through `addopts`, the
# COFF builders the fixture generator imports, the on-disk cache builders,
# the bounded thread join, and the W3C validator both HTML surfaces go through,
# none of which a typing regression would reach only at runtime) plus every
# tests/ module that already passes --strict clean.  The rest of tests/ is
# still unchecked; add a module here as it comes clean rather than relaxing
# the gate for the tree.
# Every clean tests/ module is listed, test_check_sdist_wheel.py included: the
# "Source file found twice under different module names" abort that used to
# keep it out does not reproduce, and with it listed `uv run mypy` reports the
# findings it did before on a wider tree.

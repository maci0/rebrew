[build-system]
# Exact pin: `uv build` resolves build-system.requires from PyPI on every
# isolated build (not uv.lock), so a range would let a new setuptools
# patch silently change wheel/sdist layout.  Keep below 81 — that is the
# last line known to match this project's SOURCE_DATE_EPOCH wheel contract.
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "rebrew"
# Single source of truth: rebrew.__version__ (see [tool.setuptools.dynamic]).
dynamic = ["version"]
description = "Compiler-in-the-loop decompilation workbench for binary-matching game reversing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Marcel W. Wysocki", email = "maci.stgn@gmail.com" },
]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Disassemblers",
    "Typing :: Typed",
]
dependencies = [
    # Floors track the audited uv.lock versions: a lock-free `pip install`
    # cannot resolve older advisories this tree already left behind.
    "capstone>=5.0.9",  # PYSEC-2026-3544 fixed in 5.0.8; lock is 5.0.9
    "click>=8.5.0",  # direct import (init.py shell completion); 8.3.3 fixes CVE-2025-6143/6144
    "diskcache>=5.6.3",  # GHSA-w8v5-vhqr-4h9v unfixed upstream; NoPickleDisk + chmod 0o700 mitigate (compile_cache / matcher.core)
    "httpx>=0.28.1",  # ReVa MCP / remote-tooling HTTP client (ghidra/, skeleton.py, decompiler.py, wibo.py)
    "idna>=3.19",  # NO direct import — transitive security pin: idna <3.15 has a Unicode-property DoS advisory; this floor forces the fixed version through httpx's tree
    "lief>=1.0.0",  # 1.0 verified: full suite green (was held at <1 on breaking rumors)
    "numpy>=2.5.3",  # byte/structural similarity scoring (matcher/scoring.py, core/matching.py, binary_similarity.py)
    "python-flirt>=0.10.0",  # FLIRT .sig signature scanning (flirt.py; imports as `flirt`)
    "rich>=15.0.0",  # console rendering (Console(stderr=True) convention) and typer's markup backend
    "tomlkit>=0.15.1",  # round-trip-preserving TOML writes (metadata.py, cfg.py, library.py)
    "tree-sitter>=0.26.0",  # C AST parsing (c_parser.py, struct_parser.py, matcher/ast_engine.py) — never regex-parse C
    "tree-sitter-c>=0.24.2",  # C grammar for tree-sitter
    "typer>=0.27.2",  # rich_markup_mode requires 0.10.0
    "zstandard>=0.25.0",  # coverage.db codec for the materialized per-section cell JSON (build_db), and the dashboard's wire compression
]

[project.optional-dependencies]
# Only PyPI-installable extras belong here — their Requires-Dist lines ship in
# the wheel METADATA.  Path/git-only deps (similarity, m2c) live under
# [dependency-groups] so a `pip install rebrew[...]` / PyPI upload cannot
# resolve the wrong package or reject a direct URL.
prove = [
    "angr>=9.3.4",
    "claripy>=9.3.4",  # direct import in prove.py / doctor.py; same release train as angr
    "gitpython>=3.1.62",  # angr→gitpython transitively; 3.1.58+ fixes the RCE-class advisories
]
# BinSync state I/O: declib is BinSync's artifact layer.  rebrew.binsync.serial
# is the single module that touches it; the CLIs raise a clear install error
# when the extra is absent.
binsync = [
    "declib>=4.5.0",
]


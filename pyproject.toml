[build-system]
# Exact pin: `uv build` resolves build-system.requires from PyPI on every
# isolated build (not uv.lock), so a range would let a new setuptools
# patch silently change wheel/sdist layout. The pinned backend is checked
# against the normalized wheel/sdist reproducibility contract.
# build-constraints.txt pins the same version by hash; bump both together.
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "rebrew"
# Single source of truth: rebrew.__version__ (see [tool.setuptools.dynamic]).
dynamic = ["version"]
description = "Compiler-in-the-loop decompilation workbench for binary-matching game reversing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Marcel W. Wysocki", email = "maci.stgn@gmail.com" },
]
keywords = ["decompilation", "binary-matching", "game-reversing", "disassemblers", "FLIRT"]
requires-python = ">=3.15"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Disassemblers",
    "Typing :: Typed",
]
dependencies = [
    # Floors track the audited uv.lock versions: a lock-free `pip install`
    # cannot resolve older advisories this tree already left behind.
    # Ceilings sit at the next breaking major.  A resolver always takes the
    # newest admissible version, so a floor alone lets a new major land in
    # every user's environment on the day it is published — a 1.0 LIEF or a
    # tree-sitter binding rewrite breaks the wheel at import, with no review
    # step in between.  The cap turns that into a resolver error the tree can
    # re-audit, and tests/test_package_metadata.py keeps one on every
    # requirement added later.
    "capstone>=5.0.9,<6",  # PYSEC-2026-3544 fixed in 5.0.8; lock is 5.0.9
    "click>=8.5.1,<9",  # direct import (init.py shell completion); 8.3.3 fixes CVE-2025-6143/6144
    "diskcache>=5.6.3,<6",  # GHSA-w8v5-vhqr-4h9v unfixed upstream; NoPickleDisk + chmod 0o700 mitigate (compiler/cache.py)
    "httpx>=0.28.1,<1",  # ReVa MCP / remote-tooling HTTP client (ghidra/, skeleton.py, decompiler.py, wibo.py)
    "idna>=3.20,<4",  # NO direct import — transitive security pin: idna <3.15 has a Unicode-property DoS advisory; this floor forces the fixed version through httpx's tree
    "lief>=1.0.0,<2",  # 1.0 verified: full suite green (was held at <1 on breaking rumors)
    "numpy>=2.5.4,<3",  # byte/structural similarity scoring (matcher/scoring.py, core/matching.py, binary_similarity.py)
    "python-flirt @ https://github.com/maci0/lancelot/releases/download/python-flirt-v0.10.2-relumea.1/python_flirt-0.10.2%2Brelumea.1.tar.gz#sha256=5ad7a93c992d33478d97b8ce874fa7d5b92a121a949cd2a7e8f589e1a48fff01",  # FLIRT .sig signature scanning (flirt.py; imports as `flirt`)
    "pyyaml>=6.0.3,<7",  # splat config YAML (splat_config.py; replaces the hand-rolled subset reader)
    "rich>=15.0.0,<16",  # console rendering (Console(stderr=True) convention) and typer's markup backend
    "tomlkit>=0.15.2,<1",  # round-trip-preserving TOML writes (metadata/functions.py, cfg.py, library.py)
    "tree-sitter>=0.26.1,<1",  # C AST parsing (c_parser.py, struct_parser.py, matcher/ast_engine.py) — never regex-parse C
    "tree-sitter-c>=0.24.2,<1",  # C grammar for tree-sitter
    "typer>=0.29.1,<1",  # CLI framework (every main_entry); floor tracks lock
    "zstandard>=0.25.0,<1",  # the dashboard's wire compression (report.py, compression.py); coverage itself is clear text
]

[project.optional-dependencies]
# Only PyPI-installable extras belong here — their Requires-Dist lines ship in
# the wheel METADATA.  Path/git-only deps (similarity, m2c) live under
# [dependency-groups] so a `pip install rebrew[...]` / PyPI upload cannot
# resolve the wrong package or reject a direct URL.
prove = [
    "angr>=10.0.6,<11",  # BSD-2-Clause; pulls pyvex (LibVEX is GPL-2.0-or-later, see NOTICE)
    "gitpython>=3.2.1,<4",  # NO direct import — transitive security pin (same pattern as idna): 3.1.58+ fixes the RCE-class advisories angr would otherwise resolve
]
# BinSync state I/O: declib is BinSync's artifact layer.  rebrew.binsync.serial
# is the single module that touches it; the CLIs raise a clear install error
# when the extra is absent.
binsync = [
    "declib>=4.5.0,<5",
]
pgsql = [
    "psycopg>=3.3.8,<4",
]

[project.scripts]
# One executable for people and build tools (ADR 027).
rebrew = "rebrew.app.main:main"

[project.urls]
Homepage = "https://github.com/maci0/rebrew"
Repository = "https://github.com/maci0/rebrew"
Issues = "https://github.com/maci0/rebrew/issues"
Changelog = "https://github.com/maci0/rebrew/blob/main/CHANGELOG.md"
Security = "https://github.com/maci0/rebrew/blob/main/SECURITY.md"

[tool.setuptools.dynamic]
version = { attr = "rebrew.__version__" }

[tool.setuptools.package-data]
# ``**/py.typed`` covers subpackages (e.g. workspace/) — a bare ``py.typed``
# only matches the package root and would drop nested PEP 561 markers.
# ``agent-skills/**/*`` ships every skill asset (not only ``*.md``) so a
# future non-markdown reference file cannot silently drop out of the wheel.
rebrew = ["agent-skills/**/*", "*.template", "PRINCIPLES.md", "compiler/*.c", "**/py.typed", "py.typed"]

# Contributor-only AGENTS.md under subpackages (app/, matcher/, compiler/, formats/, metadata/, catalog/, ghidra/,
# binsync/, workspace/) must not
# ride into the wheel if include-package-data ever widens the sdist file set.
[tool.setuptools.exclude-package-data]
rebrew = ["**/AGENTS.md"]

[tool.setuptools.packages.find]
where = ["src"]

# src/ layout would otherwise write ``src/rebrew.egg-info/`` during the build.
# Park egg-info at the project root so MANIFEST can prune the bulk; setuptools
# still force-appends ``SOURCES.txt`` into the sdist (expected), but the
# duplicate PKG-INFO / entry_points / requires.txt residue stays out.
[tool.distutils.egg_info]
egg_base = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``tests`` is on the path so the suite plugins load without a conftest.
pythonpath = ["src", ".", "tests"]
# Force the same ANSI-off env as ``make test`` / CI so bare ``uv run pytest``
# stays green when FORCE_COLOR or GITHUB_ACTIONS is set in the developer shell.
addopts = ["-p", "pytest_ansi_env", "-p", "source_util"]
filterwarnings = [
    # LIEF C extension emits this when parsing minimal Mach-O stubs with zeroed headers
    "ignore:0 is not a valid CPU_TYPE:RuntimeWarning",
    # Test fixtures routinely load configs whose fake target binary does not
    # exist; the load-time warning is for real users, not the suite.
    "ignore:target binary not found:UserWarning",
    # Fixture trees contain 0444-locked metadata TOMLs; pytest's tmp_path
    # teardown warns (rm_rf) when removing them. The files are in /tmp and
    # harmless — the warning drowns real ones (~2400 per full run). Scoped to
    # the rm_rf text: a class-wide `ignore::pytest.PytestWarning` also hides
    # PytestUnraisableExceptionWarning (an exception in __del__ / a thread) and
    # PytestReturnNotNoneWarning (a test that started returning a value).
    # ini filter messages are regexes (pytest escapes only -W ones), so the
    # parentheses need escaping to match the literal "(rm_rf)" prefix.
    "ignore:\\(rm_rf\\):pytest.PytestWarning",
]

[tool.slipcover]
source = ["src/rebrew"]
# Run: make coverage.  slipcover reads only CLI flags, not this section, so
# the Makefile's COV_FLOOR passes --fail-under; keep the two equal.  The floor
# ratchets (AGENTS.md): coverage may rise, never fall.
fail_under = 85
# Or for JSON output: uv run python -m slipcover --json cov.json -m pytest

[tool.ruff]
target-version = "py315"
line-length = 100
# `make lint` runs ruff over `.` (the same default scope the pre-commit
# `ruff-check` hook resolves filenames against) so a top-level script cannot
# fall outside the gate.  These gitignored trees hold scratch scripts and
# hypothesis databases; ruff already excludes .mypy_cache/.pytest_cache/
# .ruff_cache.
extend-exclude = [".hypothesis", ".scratch"]

[tool.ruff.lint]
# The selection is a ratchet: a code joins `select` only once the tree passes
# it, so a new finding is a regression rather than pre-existing debt. RUF100
# keeps a `noqa` honest: a stale or wrong-code suppression fails lint. Family
# entries below are the zero-finding subset; codes that still fire stay off.
# Preview-only codes are omitted (selecting them is a no-op without
# preview=true); remapped aliases are selected through their current code
# (PLR1701->SIM101, RUF011->B035, RUF035->S704, TRY200->B904).
#
# D100/D104/D106 enforce the module-docstring rule; TID252 gives the layering
# rule teeth. B904 is enforced, not ignored. ANN204/ANN205/ANN206 cover the
# self/cls-only signature shapes; ANN001/ANN002/ANN003 stay off because
# --strict mypy verifies the same annotations with better errors (ruff ANN
# reports no useful message on a strict-mypy tree).
#
# Deliberately off: D203/D213 (conflict with D211), D300 (formatter),
# ISC001/ISC002 (ruff format), PT004/PT005 (deprecated upstream), and RET504
# (a named intermediate reads better than an inlined comprehension).
# PERF403, C416 and C402 disagree on `{k: v for k, v in it}`: index the parsed
# rows instead (layout_meta). The pylint PLR*/PLW*/PLC* rows below are the
# zero-finding subset of the preview-only pylint rules; C4/TRY*/S*/PT*/PTH*
# families stay off where they still fire (see the ratchet note above).
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "C4", "DTZ", "RSE", "EXE", "Q",
    "NPY", "ICN", "G", "PGH", "YTT", "ASYNC", "FA", "SLOT", "PLE",

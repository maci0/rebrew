[build-system]
# Pin upper bound so PEP 517 isolated builds cannot silently pick a new
# setuptools major that changes wheel/sdist layout or metadata.
requires = ["setuptools>=68.0,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "rebrew"
# Single source of truth: rebrew.__version__ (see [tool.setuptools.dynamic]).
dynamic = ["version"]
description = "Compiler-in-the-loop decompilation workbench for binary-matching game reversing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Marcel W. Wysocki", email = "maci.stgn@gmail.com" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = [
    "capstone>=5.0.0",
    "diskcache>=5.6",
    "httpx>=0.28",
    "lief>=0.17.4",
    "numpy>=1.26",
    "python-flirt>=0.9.10",
    "rich>=13.0",
    "tomlkit>=0.12",
    "tree-sitter>=0.25.2",
    "tree-sitter-c>=0.24.1",
    "typer>=0.9",
]

[project.optional-dependencies]
prove = [
    "angr>=9.2",
]

[project.scripts]
rebrew = "rebrew.main:main"
rebrew-round-trip = "rebrew.round_trip:main_entry"
rebrew-skills = "rebrew.skills:main_entry"

[project.urls]
Homepage = "https://github.com/maci0/rebrew"
Repository = "https://github.com/maci0/rebrew"

[tool.setuptools.dynamic]
version = { attr = "rebrew.__version__" }

[tool.setuptools.package-data]
rebrew = ["agent-skills/**/*.md", "*.template", "PRINCIPLES.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = [
    # LIEF C extension emits this when parsing minimal Mach-O stubs with zeroed headers
    "ignore:0 is not a valid CPU_TYPE:RuntimeWarning",
]

[tool.slipcover]
source = ["src/rebrew"]
# Run: uv run python -m slipcover -m pytest
# Or for JSON output: uv run python -m slipcover --json cov.json -m pytest

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.per-file-ignores]
# Re-export packages expose public API via __init__.py — redundant aliases
# are the canonical way to silence F401 for intentional re-exports, but we
# keep the suppression as a safety net for any future additions.
# (All current re-exports use explicit `X as X` aliases.)

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=2.1,<3",
    "pytest>=9.0.2",
    "slipcover>=1.0.17",
    "ruff>=0.3",
    "pre-commit>=4.5.1",
    "hypothesis>=6.165.2",
]

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = ["venv", ".venv"]
disallow_untyped_decorators = false

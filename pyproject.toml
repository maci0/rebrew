[build-system]
# Exact pin: `uv build` resolves build-system.requires from PyPI on every
# isolated build (not uv.lock), so a range would let a new setuptools
# patch silently change wheel/sdist layout.  Keep below 81 — that is the
# last line known to match this project's SOURCE_DATE_EPOCH wheel contract.
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "rebrew"
# Single source of truth: rebrew.__version__ (see [tool.setuptools.dynamic]).
dynamic = ["version"]
description = "Compiler-in-the-loop decompilation workbench for binary-matching game reversing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Marcel W. Wysocki", email = "maci.stgn@gmail.com" },
]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = [
    # Floors track the audited uv.lock versions: a lock-free `pip install`
    # cannot resolve older advisories this tree already left behind.
    "capstone>=5.0.9",  # PYSEC-2026-3544 fixed in 5.0.8; lock is 5.0.9
    "click>=8.5.0",  # direct import (init.py shell completion, tests); 8.3.3 fixes CVE-2025-6143/6144
    "diskcache>=5.6.3",  # advisory (unsafe pickle) has no fix yet — cache stores only compile .obj bytes, not untrusted input
    "httpx>=0.28.1",  # ReVa MCP / remote-tooling HTTP client (ghidra/, skeleton.py, decompiler.py, wibo.py)
    "idna>=3.19",  # NO direct import — transitive security pin: idna <3.15 has a Unicode-property DoS advisory; this floor forces the fixed version through httpx's tree
    "lief>=1.0.0",  # 1.0 verified: full suite green (was held at <1 on breaking rumors)
    "numpy>=2.5.3",  # byte/structural similarity scoring (matcher/scoring.py, core/matching.py, binary_similarity.py)
    "python-flirt>=0.10.0",  # FLIRT .sig signature scanning (flirt.py; imports as `flirt`)
    "rich>=15.0.0",  # console rendering (Console(stderr=True) convention) and typer's markup backend
    "tomlkit>=0.15.1",  # round-trip-preserving TOML writes (metadata.py, cfg.py, library.py)
    "tree-sitter>=0.26.0",  # C AST parsing (c_parser.py, struct_parser.py, matcher/ast_engine.py) — never regex-parse C
    "tree-sitter-c>=0.24.2",  # C grammar for tree-sitter
    "typer>=0.27.2",  # rich_markup_mode requires 0.10.0
    "zstandard>=0.25.0",  # coverage.db codec for the materialized per-section cell JSON (build_db), and the dashboard's wire compression
]

[project.optional-dependencies]
# Only PyPI-installable extras belong here — their Requires-Dist lines ship in
# the wheel METADATA.  Path/git-only deps (similarity, m2c) live under
# [dependency-groups] so a `pip install rebrew[...]` / PyPI upload cannot
# resolve the wrong package or reject a direct URL.
prove = [
    "angr>=9.3.4",
    "claripy>=9.3.4",  # direct import in prove.py / doctor.py; same release train as angr
    "gitpython>=3.1.62",  # angr→gitpython transitively; 3.1.58+ fixes the RCE-class advisories
]
# BinSync state I/O: declib is BinSync's artifact layer.  rebrew.binsync.serial
# is the single module that touches it; the CLIs raise a clear install error
# when the extra is absent.
binsync = [
    "declib>=4.5.0",
]

[project.scripts]
rebrew = "rebrew.main:main"
rebrew-round-trip = "rebrew.round_trip:main_entry"
rebrew-skills = "rebrew.skills:main_entry"
rebrew-strings = "rebrew.strings:main_entry"
rebrew-xrefs = "rebrew.xrefs:main_entry"
rebrew-describe = "rebrew.describe:main_entry"
rebrew-drift = "rebrew.drift_cmd:main_entry"
rebrew-report = "rebrew.report:main_entry"
rebrew-symbol-addrs = "rebrew.symbol_addrs:main_entry"
rebrew-context = "rebrew.context:main_entry"
rebrew-objdiff = "rebrew.objdiff_project:main_entry"
rebrew-objdiff-build = "rebrew.objdiff_project:objdiff_build_entry"
rebrew-decompme = "rebrew.decompme:main_entry"

rebrew-analyze = "rebrew.analyze:main_entry"
rebrew-asm = "rebrew.asm:main_entry"
rebrew-binsync-diff = "rebrew.binsync.diff:main_entry"
rebrew-binsync-export = "rebrew.binsync.export:main_entry"
rebrew-binsync-import = "rebrew.binsync.importer:main_entry"
rebrew-binsync-init = "rebrew.binsync.init:main_entry"
rebrew-binsync-overlay = "rebrew.binsync.overlay:main_entry"
rebrew-binsync = "rebrew.binsync.cli:main_entry"
rebrew-build-db = "rebrew.build_db:main_entry"
rebrew-cache-cli = "rebrew.cache_cli:main_entry"
rebrew-cfg = "rebrew.cfg:main_entry"
rebrew-crt-match = "rebrew.crt_match:main_entry"
rebrew-lib-match = "rebrew.lib_match:main_entry"
rebrew-climb = "rebrew.climb:main_entry"
rebrew-dashboard = "rebrew.dashboard:main_entry"
rebrew-data = "rebrew.data:main_entry"
rebrew-depgraph = "rebrew.depgraph:main_entry"
rebrew-diff = "rebrew.diff:main_entry"
rebrew-discover = "rebrew.discover:main_entry"
rebrew-doctor = "rebrew.doctor:main_entry"
rebrew-document-unmatched = "rebrew.document_unmatched:main_entry"
rebrew-extract = "rebrew.extract:main_entry"
rebrew-flirt = "rebrew.flirt:main_entry"
rebrew-gen-flirt-pat = "rebrew.gen_flirt_pat:main_entry"
rebrew-gen-stubs = "rebrew.gen_stubs:main_entry"
rebrew-identify-library = "rebrew.identify_library:main_entry"
rebrew-import-splat = "rebrew.splat_config:main_entry"
rebrew-imports = "rebrew.imports:main_entry"
rebrew-inline-strings = "rebrew.inline_strings:main_entry"
rebrew-init = "rebrew.init:main_entry"
rebrew-intake = "rebrew.intake:main_entry"
rebrew-link-order = "rebrew.link_order:main_entry"
rebrew-lint = "rebrew.lint:main_entry"
rebrew-match = "rebrew.match:main_entry"
rebrew-merge = "rebrew.merge:main_entry"
rebrew-merge-sweep = "rebrew.merge_sweep:main_entry"
rebrew-near-diag = "rebrew.near_diag:main_entry"
rebrew-gap-trace = "rebrew.gap_trace:main_entry"
rebrew-orphans = "rebrew.orphans:main_entry"
rebrew-pe-info = "rebrew.pe_info:main_entry"
rebrew-pdb-info = "rebrew.pdb_info:main_entry"
rebrew-prove = "rebrew.prove:main_entry"
rebrew-probe = "rebrew.probe:main_entry"
rebrew-qual-sweep = "rebrew.qual_sweep:main_entry"
rebrew-residue = "rebrew.residue:main_entry"
rebrew-rename = "rebrew.rename:main_entry"
rebrew-resource = "rebrew.resource:main_entry"
rebrew-similar = "rebrew.similar:main_entry"
rebrew-skeleton = "rebrew.skeleton:main_entry"
rebrew-solutions-db = "rebrew.solutions_db:main_entry"
rebrew-split = "rebrew.split:main_entry"
rebrew-status = "rebrew.status:main_entry"
rebrew-test = "rebrew.test:main_entry"
rebrew-todo = "rebrew.todo:main_entry"
rebrew-types = "rebrew.types_cli:main_entry"
rebrew-unpack-lzexe = "rebrew.lzexe_cli:main_entry"
rebrew-verify = "rebrew.verify:main_entry"
# CMake toolchain bridge — CMAKE_C_COMPILER/LINKER/AR wrappers (docker)
rebrew-cmake-cl = "rebrew.cmake_tc:tc_main"
rebrew-cmake-link = "rebrew.cmake_tc:tc_main"
rebrew-cmake-lib = "rebrew.cmake_tc:tc_main"

[project.urls]
Homepage = "https://github.com/maci0/rebrew"
Repository = "https://github.com/maci0/rebrew"
Issues = "https://github.com/maci0/rebrew/issues"
Changelog = "https://github.com/maci0/rebrew/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "rebrew.__version__" }

[tool.setuptools.package-data]
# ``**/py.typed`` covers subpackages (e.g. workspace/) — a bare ``py.typed``
# only matches the package root and would drop nested PEP 561 markers.
rebrew = ["agent-skills/**/*.md", "*.template", "PRINCIPLES.md", "**/py.typed", "py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

# src/ layout would otherwise write ``src/rebrew.egg-info/`` during the build.
# Park egg-info at the project root so MANIFEST can prune the bulk; setuptools
# still force-appends ``SOURCES.txt`` into the sdist (expected), but the
# duplicate PKG-INFO / entry_points / requires.txt residue stays out.
[tool.distutils.egg_info]
egg_base = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = [
    # LIEF C extension emits this when parsing minimal Mach-O stubs with zeroed headers
    "ignore:0 is not a valid CPU_TYPE:RuntimeWarning",
    # Test fixtures routinely load configs whose fake target binary does not
    # exist; the load-time warning is for real users, not the suite.
    "ignore:target binary not found:UserWarning",
    # Fixture trees contain 0444-locked metadata TOMLs; pytest's tmp_path
    # teardown warns (rm_rf) when removing them. The files are in /tmp and
    # harmless — the warning drowns real ones (~2400 per full run).
    "ignore::pytest.PytestWarning",
]

[tool.slipcover]
source = ["src/rebrew"]
# Run: uv run python -m slipcover --fail-under 80 -m pytest
# (fail-under enforced: AGENTS.md coverage ratchets — coverage may rise, never
# fall. Current suite coverage is ~92%; the floor sits below it so legitimate
# drops fail the gate instead of passing silently. NOTE: slipcover reads only
# CLI flags, not this section — always pass --fail-under explicitly; this key
# documents the floor. Check with
# `uv run python -m slipcover --json cov.json -m pytest`.)
fail_under = 80
# Or for JSON output: uv run python -m slipcover --json cov.json -m pytest

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# RUF100 keeps suppression hygiene: a `noqa` for a rule that does not fire
# (wrong code, stale after a fix) fails lint instead of silently rotting.
# C4/DTZ/RSE/EXE/Q/NPY/ICN/G/PGH/YTT are correctness-leaning groups the tree
# already passes (enabled after fixing their 9 findings; see CHANGELOG).
# ASYNC/FA/SLOT/PLE join them: zero findings on the current tree (ratchet
# only; PLE after the mutator `__all__` extend() fix).
# Individual RUF codes below are the stable (non-preview) subset of the RUF
# family the tree already passes; debt codes
# (RUF001/002/003/005/007/010/012/021–023/043/046/059) stay off until
# clean — no repo-wide ignore for them.  Preview-only RUF/FURB codes are
# omitted (selecting them is a no-op without preview=true).
# Bandit/tryceratops/refurb/pie/ret/flake8-builtins/logging/unused-arg codes
# listed below are the zero-finding stable subset of those families; debt
# siblings (S101/S108/S311/S603/…, TRY003/…, ARG001/…) stay off until clean.
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "C4", "DTZ", "RSE", "EXE", "Q",
    "NPY", "ICN", "G", "PGH", "YTT", "ASYNC", "FA", "SLOT", "PLE",
    "PLW0120", "PLW0127", "PLW0129", "PLW0131", "PLW0133", "PLW0406", "PLW0711",
    "PLW1508", "PLW1509", "PLW2101",
    "RUF006", "RUF008", "RUF009", "RUF013", "RUF015", "RUF016", "RUF017",
    "RUF018", "RUF019", "RUF020", "RUF024", "RUF026", "RUF028", "RUF030",
    "RUF032", "RUF033", "RUF034", "RUF036", "RUF037", "RUF040", "RUF041",
    "RUF048", "RUF049", "RUF051", "RUF053", "RUF057", "RUF058", "RUF060",
    "RUF061", "RUF063", "RUF064", "RUF068", "RUF100", "RUF101", "RUF102",
    "RUF103", "RUF104", "RUF200",
    "S102", "S103", "S106", "S107", "S110", "S113", "S301", "S302", "S303", "S304",
    "S305", "S306", "S307", "S308", "S310", "S312", "S313", "S314", "S315",
    "S316", "S317", "S318", "S319", "S321", "S323", "S501", "S502", "S503",
    "S504", "S505", "S506", "S507", "S508", "S509", "S601", "S604", "S605",
    "S606", "S609", "S610", "S611", "S612", "S701", "S704",
    "TRY002", "TRY201", "TRY401",
    "FURB105", "FURB116", "FURB129", "FURB132", "FURB157", "FURB161",
    "FURB163", "FURB164", "FURB166", "FURB168", "FURB169", "FURB177",
    "FURB181", "FURB187",
    "PERF101", "RET502", "RET503", "RET507",
    "PIE794", "PIE800", "PIE804",
    "A001", "A003", "A004", "A005", "A006",
    "LOG001", "LOG002", "LOG007", "LOG009",
    "ARG003", "ARG004",
]
ignore = ["E501", "B008", "B904"]

[tool.uv]
package = true

[tool.uv.sources]
# Sibling-checkout path dep (see the `similarity` dependency group): uv resolves
# `resembl` from ../resembl relative to this pyproject.toml, keeping the
# manifest free of machine-specific absolute paths.
resembl = { path = "../resembl" }

[dependency-groups]
dev = [
    "mypy>=2.3.1,<3",
    "pytest>=9.1.1",  # CVE-2025-71176 (tmpdir) fixed in 9.0.3; floor tracks lock
    "slipcover>=1.1.0",
    "ruff>=0.16.7",  # floor tracks lock; older minors shipped years-old lint rulesets
    "pre-commit>=4.6.2",
    "hypothesis>=6.168.0",
    "skills-ref>=0.1.1",  # the pre-commit "Validate Agent Skills" hook binary (infra-review F6)
]
# Optional code-similarity scoring (rebrew verify "Sim %"): sibling `resembl`
# scoring core + rapidfuzz.  Path-pinned via [tool.uv.sources] — never an
# extra, so wheel METADATA cannot point pip at the unrelated PyPI `resembl`.
# Install: `uv sync --group similarity` (needs ../resembl checked out).
similarity = [
    "resembl",
    "rapidfuzz>=3.14.6",  # direct import in matcher/scoring.py code_similarity
]
# m2c decompiler backend (decompiler.py fetch_m2c).  Not on PyPI under this
# name (the PyPI `m2c` is an unrelated OpenAPI package) — git-only, so it
# must not appear in optional-dependencies / wheel Requires-Dist.
# Commit-pinned so a floating default branch cannot silently change the
# decompiler; keep in step with the rev recorded in uv.lock.
# Install: `uv sync --group m2c`.
m2c = [
    "m2c @ git+https://github.com/matt-kempster/m2c.git@aa869da289a565c68f701e734bd74606f1bd5ed4",
]

[tool.mypy]
strict = true
# src/ is the shipped library; tools/ are the repo's own dev scripts (CI and
# the pre-commit hook both run plain `uv run mypy`, which checks both).
files = ["src/rebrew", "tools"]
exclude = ["venv", ".venv"]
# tools/gen_fixtures.py imports the COFF builders from tests/bin_util.py at
# runtime (sys.path.insert); this makes that import resolvable to mypy too,
# so the shared helper is type-checked alongside its callers.
mypy_path = ["tests"]

# Per-module untyped-import allowances instead of a global flag: every other
# third-party dep ships stubs, so a new dependency without type information
# fails the strict gate and must be listed here deliberately (with the same
# justification bar as the entries below).
[[tool.mypy.overrides]]
module = [
    "capstone",
    "capstone.*",  # no stubs / py.typed shipped upstream
    "diskcache",
    "diskcache.*",  # unsafe-pickle advisory noted in [project] dependencies; stubs still absent
    "declib",
    "declib.*",  # BinSync's artifact layer (binsync extra); no stubs/py.typed
    "flirt",
    "flirt.*",  # python-flirt ships no type information
    "resembl",
    "resembl.*",  # sibling-checkout path dep (see `similarity` group); no stubs
]
ignore_missing_imports = true

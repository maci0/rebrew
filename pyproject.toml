[tool.uv]
package = true

[tool.uv.sources]
# Sibling-checkout path dep (see the `similarity` dependency group): uv resolves
# `resembl` from ../resembl relative to this pyproject.toml, keeping the
# manifest free of machine-specific absolute paths.
resembl = { path = "../resembl" }

[dependency-groups]
dev = [
    "mypy>=2.3.1,<3",
    "pytest>=9.1.1",  # CVE-2025-71176 (tmpdir) fixed in 9.0.3; floor tracks lock
    "slipcover>=1.1.0",
    "ruff>=0.16.7",  # floor tracks lock; older minors shipped years-old lint rulesets
    "pre-commit>=4.6.2",
    "hypothesis>=6.168.0",
    "skills-ref>=0.1.1",  # the pre-commit "Validate Agent Skills" hook binary
    "pyyaml>=6.0.3",  # direct import in tests/test_ci_pins.py; was only reachable via pre-commit
]
# Optional code-similarity scoring (rebrew verify "Sim %"): sibling `resembl`
# scoring core + rapidfuzz.  Path-pinned via [tool.uv.sources] — never an
# extra, so wheel METADATA cannot point pip at the unrelated PyPI `resembl`.
# Install: `uv sync --group similarity` (needs ../resembl checked out).
similarity = [
    "resembl",
    "rapidfuzz>=3.14.6",  # direct import in matcher/scoring.py code_similarity
]
# m2c decompiler backend (decompiler.py fetch_m2c).  Not on PyPI under this
# name (the PyPI `m2c` is an unrelated OpenAPI package) — git-only, so it
# must not appear in optional-dependencies / wheel Requires-Dist.
# Commit-pinned so a floating default branch cannot silently change the
# decompiler; keep in step with the rev recorded in uv.lock.
# Install: `uv sync --group m2c`.
m2c = [
    "m2c @ git+https://github.com/matt-kempster/m2c.git@aa869da289a565c68f701e734bd74606f1bd5ed4",
]

[tool.mypy]
strict = true
# Zero-finding extras beyond --strict: keep enabled so regressions fail CI.
extra_checks = true
enable_error_code = [
    "ignore-without-code",
    "unused-awaitable",
    "mutable-override",
    "exhaustive-match",
    "unimported-reveal",
    "truthy-iterable",
    "redundant-self",
    "deprecated",
    "narrowed-type-not-subtype",
    "possibly-undefined",
]
# src/ is the shipped library; tools/ are the repo's own dev scripts (CI and
# the pre-commit hook both run plain `uv run mypy`, which checks both).
files = ["src/rebrew", "tools"]
exclude = ["venv", ".venv"]
# tools/gen_fixtures.py imports the COFF builders from tests/bin_util.py at
# runtime (sys.path.insert); this makes that import resolvable to mypy too,
# so the shared helper is type-checked alongside its callers.
mypy_path = ["tests"]

# Per-module untyped-import allowances instead of a global flag: every other
# third-party dep ships stubs, so a new dependency without type information
# fails the strict gate and must be listed here deliberately (with the same
# justification bar as the entries below).
[[tool.mypy.overrides]]
module = [
    "capstone",
    "capstone.*",  # no stubs / py.typed shipped upstream
    "diskcache",
    "diskcache.*",  # GHSA-w8v5-vhqr-4h9v mitigated via NoPickleDisk; stubs still absent
    "declib",
    "declib.*",  # BinSync's artifact layer (binsync extra); no stubs/py.typed
    "flirt",
    "flirt.*",  # python-flirt ships no type information
    "resembl",
    "resembl.*",  # sibling-checkout path dep (see `similarity` group); no stubs
]
ignore_missing_imports = true

# possibly-undefined debt: these modules bind names under conditions that
# are correlated with their later use (same guard, early error_exit), which
# mypy cannot prove.  Shrink-only: restructure a module, then drop it here.
[[tool.mypy.overrides]]
module = [
    "rebrew.asm",
    "rebrew.calibrate_bss",
    "rebrew.data",
    "rebrew.doctor",
    "rebrew.matcher.scoring",
    "rebrew.name_decomp",
    "rebrew.prove",
    "rebrew.skeleton",
    "rebrew.test",
]
disable_error_code = ["possibly-undefined"]

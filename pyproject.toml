rebrew-unpack-lzexe = "rebrew.lzexe_cli:main_entry"
rebrew-verify = "rebrew.verify:main_entry"
# CMake toolchain bridge — CMAKE_C_COMPILER/LINKER/AR wrappers (docker)
rebrew-cmake-cl = "rebrew.cmake_tc:tc_main"
rebrew-cmake-link = "rebrew.cmake_tc:tc_main"
rebrew-cmake-lib = "rebrew.cmake_tc:tc_main"

[project.urls]
Homepage = "https://github.com/maci0/rebrew"
Repository = "https://github.com/maci0/rebrew"
Issues = "https://github.com/maci0/rebrew/issues"
Changelog = "https://github.com/maci0/rebrew/blob/main/CHANGELOG.md"
Security = "https://github.com/maci0/rebrew/blob/main/SECURITY.md"

[tool.setuptools.dynamic]
version = { attr = "rebrew.__version__" }

[tool.setuptools.package-data]
# ``**/py.typed`` covers subpackages (e.g. workspace/) — a bare ``py.typed``
# only matches the package root and would drop nested PEP 561 markers.
# ``agent-skills/**/*`` ships every skill asset (not only ``*.md``) so a
# future non-markdown reference file cannot silently drop out of the wheel.
rebrew = ["agent-skills/**/*", "*.template", "PRINCIPLES.md", "**/py.typed", "py.typed"]

# Contributor-only AGENTS.md under subpackages (matcher/, catalog/) must not
# ride into the wheel if include-package-data ever widens the sdist file set.
[tool.setuptools.exclude-package-data]
rebrew = ["**/AGENTS.md"]

[tool.setuptools.packages.find]
where = ["src"]

# src/ layout would otherwise write ``src/rebrew.egg-info/`` during the build.
# Park egg-info at the project root so MANIFEST can prune the bulk; setuptools
# still force-appends ``SOURCES.txt`` into the sdist (expected), but the
# duplicate PKG-INFO / entry_points / requires.txt residue stays out.
[tool.distutils.egg_info]
egg_base = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``tests`` is on the path so ``-p pytest_ansi_env`` loads without a conftest.
pythonpath = ["src", ".", "tests"]
# Force the same ANSI-off env as ``make test`` / CI so bare ``uv run pytest``
# stays green when FORCE_COLOR or GITHUB_ACTIONS is set in the developer shell.
addopts = ["-p", "pytest_ansi_env"]
filterwarnings = [
    # LIEF C extension emits this when parsing minimal Mach-O stubs with zeroed headers
    "ignore:0 is not a valid CPU_TYPE:RuntimeWarning",
    # Test fixtures routinely load configs whose fake target binary does not
    # exist; the load-time warning is for real users, not the suite.
    "ignore:target binary not found:UserWarning",
    # Fixture trees contain 0444-locked metadata TOMLs; pytest's tmp_path
    # teardown warns (rm_rf) when removing them. The files are in /tmp and
    # harmless — the warning drowns real ones (~2400 per full run).
    "ignore::pytest.PytestWarning",
]

[tool.slipcover]
source = ["src/rebrew"]
# Run: make coverage.  slipcover reads only CLI flags, not this section, so
# the Makefile's COV_FLOOR passes --fail-under; keep the two equal.  The floor
# ratchets (AGENTS.md): coverage may rise, never fall.
fail_under = 85
# Or for JSON output: uv run python -m slipcover --json cov.json -m pytest

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# RUF100 keeps suppression hygiene: a `noqa` for a rule that does not fire
# (wrong code, stale after a fix) fails lint instead of silently rotting.
# C4/DTZ/RSE/EXE/Q/NPY/ICN/G/PGH/YTT are correctness-leaning groups the tree
# already passes (enabled after fixing their 9 findings; see CHANGELOG).
# ASYNC/FA/SLOT/PLE join them: zero findings on the current tree (ratchet
# only; PLE after the mutator `__all__` extend() fix).
# Individual RUF codes below are the stable (non-preview) subset of the RUF
# family the tree already passes; debt codes
# (RUF001/002/003/005/007/010/012/021–023/043/046/059) stay off until
# clean — no repo-wide ignore for them.  Preview-only RUF/FURB codes are
# omitted (selecting them is a no-op without preview=true).
# Bandit/tryceratops/refurb/pie/ret/flake8-builtins/logging/unused-arg codes
# listed below are the zero-finding stable subset of those families; debt
# siblings (S101/S108/S311/S603/…, TRY003/…, ARG001/…) stay off until clean.
# pylint (PLW/PLC/PLR), flake8-type-checking (TC), flake8-errmsg (EM),
# flake8-pytest-style (PT), and ISC003 are the same ratchet: only codes the
# tree already passes.  ISC001/ISC002 stay off (formatter conflict); TID*
# stays off until a banned-api list exists (empty config would be a no-op).
# T100/T203 (debugger/pprint) and the zero-finding PTH subset join as
# ratchets; B904 is enforced after exception-chain fixes (do not re-add
# it to ignore).  PTH debt (PTH101/105/108/110/118/120/123/201/202) stays
# off until clean.  Do not list remapped aliases (PLR1701→SIM101,
# RUF011→B035, RUF035→S704, TRY200→B904): those families/codes are already
# selected.  S602/PLR0124/PIE790/ANN205/ANN206 join as zero-finding
# ratchets (shell=True subprocess, self-compare, useless pass, typed
# class/static method returns).  D100/D104/D106 enforce the module-docstring
# rule (AGENTS.md); the D2xx/D4xx, COM818, pep8-naming (N), flake8-pyi (PYI), TD,
# TID252 and FIX001/003/004 (FIXME/XXX/HACK markers) codes below are the
# zero-finding subset.  Still off: D101-D103/D205/D209/D401 (thousands of findings), N802/N806/N814 (Win32 API names), PYI034/
# PYI036/PYI056, and D203/D206/D213/D300 (formatter or D211/D212 conflicts).
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "C4", "DTZ", "RSE", "EXE", "Q",
    "NPY", "ICN", "G", "PGH", "YTT", "ASYNC", "FA", "SLOT", "PLE",
    "T100", "T203",
    "PLW0120", "PLW0127", "PLW0128", "PLW0129", "PLW0131", "PLW0133", "PLW0177",
    "PLW0211", "PLW0245", "PLW0406", "PLW0602", "PLW0604", "PLW0642", "PLW0711",
    "PLW1501", "PLW1507", "PLW1508", "PLW1509", "PLW1641", "PLW2101", "PLW3301",
    "PLC0105", "PLC0131", "PLC0132", "PLC0205", "PLC0207", "PLC0208", "PLC1802",
    "PLC2401", "PLC2403", "PLC3002",
    "PLR0124", "PLR0133", "PLR0206", "PLR1704", "PLR1708", "PLR1716", "PLR1722",
    "PLR1733", "PLR1736", "PLR2044",

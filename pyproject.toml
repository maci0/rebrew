[build-system]
# Pin upper bound so PEP 517 isolated builds cannot silently pick a new
# setuptools major that changes wheel/sdist layout or metadata.
requires = ["setuptools>=68.0,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "rebrew"
# Single source of truth: rebrew.__version__ (see [tool.setuptools.dynamic]).
dynamic = ["version"]
description = "Compiler-in-the-loop decompilation workbench for binary-matching game reversing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Marcel W. Wysocki", email = "maci.stgn@gmail.com" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = [
    "capstone>=5.0.8",  # PYSEC-2026-3544 fixed in 5.0.8
    "click>=8.3.3",  # direct import (init.py shell completion, tests); 8.3.3 fixes CVE-2025-6143/6144
    "diskcache>=5.6",  # advisory (unsafe pickle) has no fix yet — cache stores only compile .obj bytes, not untrusted input
    "httpx>=0.28",  # ReVa MCP / remote-tooling HTTP client (ghidra/, skeleton.py, decompiler.py, wibo.py)
    "idna>=3.15",  # NO direct import — transitive security pin: idna <3.15 has a Unicode-property DoS advisory; this floor forces the fixed version through httpx's tree
    "lief>=0.17.4,<1",  # 1.0.0 is breaking
    "numpy>=1.26",  # byte/structural similarity scoring (matcher/scoring.py, core/matching.py, binary_similarity.py)
    "python-flirt>=0.9.10",  # FLIRT .sig signature scanning (flirt.py; imports as `flirt`)
    "rich>=13.0",  # console rendering (Console(stderr=True) convention) and typer's markup backend
    "tomlkit>=0.12",  # round-trip-preserving TOML writes (metadata.py, cfg.py, library.py)
    "tree-sitter>=0.25.2",  # C AST parsing (c_parser.py, struct_parser.py, matcher/ast_engine.py) — never regex-parse C
    "tree-sitter-c>=0.24.1",  # C grammar for tree-sitter
    "typer>=0.10",  # rich_markup_mode requires 0.10.0 (deps-review F1: the 0.9 floor admitted a version the CLI cannot start on)
]

[project.optional-dependencies]
prove = [
    "angr>=9.2",
    "claripy",  # direct import in prove.py / doctor.py (angr hard-depends on it, but the extra must declare its own imports)
    "gitpython>=3.1.58",  # angr→gitpython transitively; 3.1.58 fixes the RCE-class advisories
]
# Optional code-similarity scoring (rebrew verify "Sim %"): the similarity
# score reuses the sibling `resembl` project's dependency-light scoring core
# (resembl/scoring.py — importable without its sqlmodel/sqlalchemy DB stack).
# resembl pulls pygments/rapidfuzz/datasketch/numpy transitively.  Plain
# `uv pip install -e .` keeps working (the column stays NULL); install this
# extra to enable the score.  Path is relative to this checkout: it resolves
# against the conventional sibling layout (same parent dir as rebrew, like
# the rebrew-toolchains checkout).
# UV-ONLY: [tool.uv.sources] below pins `resembl` to the sibling path, but a
# non-uv `pip install ".[similarity]"` would resolve the bare name from PyPI,
# which this project does not own — pip users must install ../resembl by hand.
similarity = [
    "resembl",
    "rapidfuzz>=3.13",  # direct import in matcher/scoring.py code_similarity (resembl only declares it transitively)
]

[project.scripts]
rebrew = "rebrew.main:main"
rebrew-round-trip = "rebrew.round_trip:main_entry"
rebrew-skills = "rebrew.skills:main_entry"
rebrew-strings = "rebrew.strings:main_entry"
rebrew-xrefs = "rebrew.xrefs:main_entry"
rebrew-describe = "rebrew.describe:main_entry"
rebrew-report = "rebrew.report:main_entry"
rebrew-symbol-addrs = "rebrew.symbol_addrs:main_entry"
rebrew-context = "rebrew.context:main_entry"
rebrew-objdiff = "rebrew.objdiff_project:main_entry"
rebrew-objdiff-build = "rebrew.objdiff_project:objdiff_build_entry"
rebrew-decompme = "rebrew.decompme:main_entry"

rebrew-analyze = "rebrew.analyze:main_entry"
rebrew-asm = "rebrew.asm:main_entry"
rebrew-binsync-diff = "rebrew.binsync_diff:main_entry"
rebrew-binsync-export = "rebrew.binsync_export:main_entry"
rebrew-binsync-import = "rebrew.binsync_import:main_entry"
rebrew-build-db = "rebrew.build_db:main_entry"
rebrew-cache-cli = "rebrew.cache_cli:main_entry"
rebrew-cfg = "rebrew.cfg:main_entry"
rebrew-crt-match = "rebrew.crt_match:main_entry"
rebrew-dashboard = "rebrew.dashboard:main_entry"
rebrew-data = "rebrew.data:main_entry"
rebrew-depgraph = "rebrew.depgraph:main_entry"
rebrew-diff = "rebrew.diff:main_entry"
rebrew-discover = "rebrew.discover:main_entry"
rebrew-doctor = "rebrew.doctor:main_entry"
rebrew-document-unmatched = "rebrew.document_unmatched:main_entry"
rebrew-extract = "rebrew.extract:main_entry"
rebrew-flirt = "rebrew.flirt:main_entry"
rebrew-gen-flirt-pat = "rebrew.gen_flirt_pat:main_entry"
rebrew-gen-stubs = "rebrew.gen_stubs:main_entry"
rebrew-identify-library = "rebrew.identify_library:main_entry"
rebrew-imports = "rebrew.imports:main_entry"
rebrew-inline-strings = "rebrew.inline_strings:main_entry"
rebrew-init = "rebrew.init:main_entry"
rebrew-intake = "rebrew.intake:main_entry"
rebrew-lint = "rebrew.lint:main_entry"
rebrew-match = "rebrew.match:main_entry"
rebrew-merge = "rebrew.merge:main_entry"
rebrew-near-diag = "rebrew.near_diag:main_entry"
rebrew-pdb-info = "rebrew.pdb_info:main_entry"
rebrew-prove = "rebrew.prove:main_entry"
rebrew-rename = "rebrew.rename:main_entry"
rebrew-resource = "rebrew.resource:main_entry"
rebrew-similar = "rebrew.similar:main_entry"
rebrew-skeleton = "rebrew.skeleton:main_entry"
rebrew-solutions-db = "rebrew.solutions_db:main_entry"
rebrew-split = "rebrew.split:main_entry"
rebrew-status = "rebrew.status:main_entry"
rebrew-test = "rebrew.test:main_entry"
rebrew-todo = "rebrew.todo:main_entry"
rebrew-unpack-lzexe = "rebrew.lzexe_cli:main_entry"
rebrew-verify = "rebrew.verify:main_entry"
# CMake toolchain bridge — CMAKE_C_COMPILER/LINKER/AR wrappers (docker)
rebrew-cmake-cl = "rebrew.cmake_tc:tc_main"
rebrew-cmake-link = "rebrew.cmake_tc:tc_main"
rebrew-cmake-lib = "rebrew.cmake_tc:tc_main"

[project.urls]
Homepage = "https://github.com/maci0/rebrew"
Repository = "https://github.com/maci0/rebrew"

[tool.setuptools.dynamic]
version = { attr = "rebrew.__version__" }

[tool.setuptools.package-data]
rebrew = ["agent-skills/**/*.md", "*.template", "PRINCIPLES.md", "py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = [
    # LIEF C extension emits this when parsing minimal Mach-O stubs with zeroed headers
    "ignore:0 is not a valid CPU_TYPE:RuntimeWarning",
    # Test fixtures routinely load configs whose fake target binary does not
    # exist; the load-time warning is for real users, not the suite.
    "ignore:target binary not found:UserWarning",
]

[tool.slipcover]
source = ["src/rebrew"]
# Run: uv run python -m slipcover -m pytest
# Or for JSON output: uv run python -m slipcover --json cov.json -m pytest

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# RUF100 keeps suppression hygiene: a `noqa` for a rule that does not fire
# (wrong code, stale after a fix) fails lint instead of silently rotting.
# C4/DTZ/RSE/EXE/Q/NPY/ICN/G/PGH/YTT are correctness-leaning groups the tree
# already passes (enabled after fixing their 9 findings; see CHANGELOG).
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "DTZ", "RSE", "EXE", "Q", "NPY", "ICN", "G", "PGH", "YTT", "RUF100"]
ignore = ["E501", "B008", "B904"]

[tool.uv]
package = true

[tool.uv.sources]
# Sibling-checkout path dep (see the `similarity` extra above): uv resolves
# `resembl` from ../resembl relative to this pyproject.toml, keeping the
# manifest free of machine-specific absolute paths.
resembl = { path = "../resembl" }

[dependency-groups]
dev = [
    "mypy>=2.1,<3",
    "pytest>=9.0.3",  # CVE-2025-71176 (tmpdir) fixed in 9.0.3 (deps-review F1)
    "slipcover>=1.0.17",
    "ruff>=0.3",
    "pre-commit>=4.5.1",
    "hypothesis>=6.165.2",
    "skills-ref>=0.1.1",  # the pre-commit "Validate Agent Skills" hook binary (infra-review F6)
]

[tool.mypy]
strict = true
# src/ is the shipped library; tools/ are the repo's own dev scripts (CI and
# the pre-commit hook both run plain `uv run mypy`, which checks both).
files = ["src/rebrew", "tools"]
exclude = ["venv", ".venv"]
# tools/gen_fixtures.py imports the COFF builders from tests/bin_util.py at
# runtime (sys.path.insert); this makes that import resolvable to mypy too,
# so the shared helper is type-checked alongside its callers.
mypy_path = ["tests"]

# Per-module untyped-import allowances instead of a global flag: every other
# third-party dep ships stubs, so a new dependency without type information
# fails the strict gate and must be listed here deliberately (with the same
# justification bar as the entries below).
[[tool.mypy.overrides]]
module = [
    "capstone",
    "capstone.*",  # no stubs / py.typed shipped upstream
    "diskcache",
    "diskcache.*",  # unsafe-pickle advisory noted in [project] dependencies; stubs still absent
    "flirt",
    "flirt.*",  # python-flirt ships no type information
    "resembl",
    "resembl.*",  # sibling-checkout path dep (see `similarity` extra); no stubs
]
ignore_missing_imports = true

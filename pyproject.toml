rebrew-import-splat = "rebrew.splat_config:main_entry"
rebrew-imports = "rebrew.imports:main_entry"
rebrew-inline-strings = "rebrew.inline_strings:main_entry"
rebrew-init = "rebrew.init:main_entry"
rebrew-intake = "rebrew.intake:main_entry"
rebrew-link-order = "rebrew.link_order:main_entry"
rebrew-lint = "rebrew.lint:main_entry"
rebrew-match = "rebrew.match:main_entry"
rebrew-merge = "rebrew.merge:main_entry"
rebrew-merge-sweep = "rebrew.merge_sweep:main_entry"
rebrew-near-diag = "rebrew.near_diag:main_entry"
rebrew-gap-trace = "rebrew.gap_trace:main_entry"
rebrew-orphans = "rebrew.orphans:main_entry"
rebrew-pe-info = "rebrew.pe_info:main_entry"
rebrew-pdb-info = "rebrew.pdb_info:main_entry"
rebrew-prove = "rebrew.prove:main_entry"
rebrew-probe = "rebrew.probe:main_entry"
rebrew-qual-sweep = "rebrew.qual_sweep:main_entry"
rebrew-residue = "rebrew.residue:main_entry"

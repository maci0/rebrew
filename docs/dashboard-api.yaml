openapi: 3.1.0
info:
  title: Rebrew dashboard API
  version: "1.0.0"
  summary: Read-only coverage data served by `rebrew dashboard`.
  description: |
    Every route is read-only: the server reads the `coverage-<target>.toml`
    documents `rebrew build-db` writes, one per target, and non-`GET`/`HEAD`
    methods answer 405 with `Allow: GET, HEAD`.  A path the
    server does not serve answers 404 `not_found` whatever the method, so a
    404 body carries `not_found` on any path and `unknown_target` on the
    target-scoped ones; branch on `code`.

    The server has no authentication.  It binds `127.0.0.1:8000` by default
    and rejects a `Host` header that is not the bound host or a loopback
    alias, with 403 `host_not_allowed`.  See
    [THREAT_MODEL.md](THREAT_MODEL.md).

    Row lists are compact JSON arrays positioned by `cols`, never per-row
    objects.  Every text column in a row is a JSON string: an absent text
    column (the document stores `""` where the SQLite schema stored NULL) is
    sent as `""`.

    Every route can answer 500, in the same `Error` envelope:
    `database_error` when the coverage directory yielded no readable document
    at all (only `/api/health` asks that question; a single unreadable document
    beside readable ones is skipped with a log line and the rest are served),
    and `internal_error` for any other fault in a route.  There is no
    `corrupt_function_stats`: the summary aggregates are derived from the stored
    function rows, so they cannot be unreadable, and a missing or unparseable
    document is simply an unknown target (404).  A 500 is a server-side failure
    a client cannot fix, so it retries later rather than changing the request.

    Three statuses are cross-cutting and declared on every route: 304 when the
    client's `If-None-Match` matched, 403 `host_not_allowed` for a `Host`
    header that is not the bound host, and 405 `method_not_allowed` with
    `Allow: GET, HEAD`.  Three more are answered before routing, so they carry
    no path to declare them on and are stated here instead: 503 `server_busy`
    with `Retry-After`, when every handler slot is already taken by a
    connection the client is still holding; and the parse rejections
    http.server raises on the request itself, 400 `bad_request`, 414
    `uri_too_long`, 431 `header_fields_too_large`, and 505
    `http_version_not_supported`, with `request_error` standing in for any
    other status raised there.  All of them close the connection, so a client
    that reads the body knows not to reuse the socket.  Every
    response, of every status, carries `X-Request-Id`.
servers:
  - url: http://127.0.0.1:8000
    description: Default bind (`rebrew dashboard --host/--port`).

tags:
  - name: assets
    description: HTML shell and its scripts.
  - name: database
    description: Target-scoped coverage data.  All require `?target=`.

paths:
  /:
    get:
      tags: [assets]
      operationId: getIndex
      summary: Dashboard HTML shell.
      description: |
        Carries a strong `ETag` over its own bytes, so a shell change
        invalidates a held validator.  `Cache-Control: private, no-cache`.
      responses:
        "200":
          $ref: "#/components/responses/HtmlOk"
        "304": { $ref: "#/components/responses/NotModified" }
        "403": { $ref: "#/components/responses/HostNotAllowed" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/DatabaseError" }
        "503": { $ref: "#/components/responses/ServerBusy" }
    head:
      tags: [assets]
      operationId: headIndex
      summary: Headers for the dashboard HTML shell.
      responses:
        "200":
          $ref: "#/components/responses/HtmlOk"
        "304": { $ref: "#/components/responses/NotModified" }
        "403": { $ref: "#/components/responses/HostNotAllowed" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/DatabaseError" }
        "503": { $ref: "#/components/responses/ServerBusy" }

  /app.js:
    get:
      tags: [assets]
      operationId: getAppJs
      summary: Dashboard client.
      description: |
        `?v=<content hash>` is served `private, max-age=31536000,
        immutable`; any other value revalidates.  An unrecognised `v` is
        ignored, like any other unrecognised query parameter.
      parameters:
        - $ref: "#/components/parameters/CacheBuster"
      responses:
        "200":
          $ref: "#/components/responses/ScriptOk"
        "304": { $ref: "#/components/responses/NotModified" }
        "403": { $ref: "#/components/responses/HostNotAllowed" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/DatabaseError" }
        "503": { $ref: "#/components/responses/ServerBusy" }
    head:
      tags: [assets]
      operationId: headAppJs
      summary: Headers for the dashboard client.
      parameters:
        - $ref: "#/components/parameters/CacheBuster"
      responses:
        "200":
          $ref: "#/components/responses/ScriptOk"
        "304": { $ref: "#/components/responses/NotModified" }
        "403": { $ref: "#/components/responses/HostNotAllowed" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/DatabaseError" }
        "503": { $ref: "#/components/responses/ServerBusy" }

  /favicon.svg:
    get:
      tags: [assets]
      operationId: getFavicon
      summary: The rebrew mark.
      description: |
        Served rather than inlined so the shell does not carry 443 B of
        percent-encoded data URI on the cold flight.  `Cache-Control: private,
        no-cache`, like every asset whose URL is not content-hashed.
      responses:
        "200":
          $ref: "#/components/responses/FaviconOk"
        "304": { $ref: "#/components/responses/NotModified" }
        "403": { $ref: "#/components/responses/HostNotAllowed" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/DatabaseError" }
        "503": { $ref: "#/components/responses/ServerBusy" }
    head:
      tags: [assets]
      operationId: headFavicon
      summary: Headers for the rebrew mark.
      responses:
        "200":
          $ref: "#/components/responses/FaviconOk"
        "304": { $ref: "#/components/responses/NotModified" }
        "403": { $ref: "#/components/responses/HostNotAllowed" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/DatabaseError" }
        "503": { $ref: "#/components/responses/ServerBusy" }

  /api/health:
    get:
      tags: [database]
      operationId: getHealth
      summary: Liveness plus one real read of the target list.
      description: |
        The exception to the caching rules: served `no-store` with no `ETag`
        at all, so a probe that reported "ok" cannot be cached or
        revalidated into a stale "healthy" for a coverage directory that has
        since gone unreadable.  `coverage_dir` is the absolute path of the
        coverage DIRECTORY being served, holding one
        `coverage-<target>.toml` per target, and is present only when the
        bound host is a loopback address.
      responses:
        "200":
          description: The coverage directory was read.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Vary: { $ref: "#/components/headers/Vary" }
            Server-Timing: { $ref: "#/components/headers/ServerTiming" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "403": { $ref: "#/components/responses/HostNotAllowed" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/DatabaseError" }
        "503": { $ref: "#/components/responses/ServerBusy" }
    head:
      tags: [database]
      operationId: headHealth
      summary: Headers for the liveness probe.
      responses:
        "200":
          description: The coverage directory was read.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Vary: { $ref: "#/components/headers/Vary" }
            Server-Timing: { $ref: "#/components/headers/ServerTiming" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "403": { $ref: "#/components/responses/HostNotAllowed" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/DatabaseError" }
        "503": { $ref: "#/components/responses/ServerBusy" }

  /api/targets:
    get:
      tags: [database]
      operationId: getTargets
      summary: Every readable target in the coverage directory, ordered by name.
      responses:
        "200":
          description: The target list.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Vary: { $ref: "#/components/headers/Vary" }
            Server-Timing: { $ref: "#/components/headers/ServerTiming" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Targets" }
        "304": { $ref: "#/components/responses/NotModified" }
        "403": { $ref: "#/components/responses/HostNotAllowed" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/DatabaseError" }
        "503": { $ref: "#/components/responses/ServerBusy" }
    head:
      tags: [database]
      operationId: headTargets
      summary: Headers for the target list.
      responses:
        "200":
          description: The target list.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Vary: { $ref: "#/components/headers/Vary" }
            Server-Timing: { $ref: "#/components/headers/ServerTiming" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Targets" }
        "304": { $ref: "#/components/responses/NotModified" }
        "403": { $ref: "#/components/responses/HostNotAllowed" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/DatabaseError" }
        "503": { $ref: "#/components/responses/ServerBusy" }

  /api/bootstrap:
    get:
      tags: [database]
      operationId: getBootstrap
      summary: Targets plus the first target's summary and functions.
      description: |
        Collapses the cold-start waterfall (targets, then summary, then
        functions) into one round trip; filtering and paging after the first
        paint use the dedicated endpoints.  `summary` and `functions` are
        `null` only when the directory holds no readable target, since a
        first target listed by `/api/targets` always has a readable document to
        summarise.  This body is preloaded onto the same cold connection
        as the shell and `/app.js`, so its `functions` page is sized for first
        paint (`_BOOTSTRAP_FUNCTION_LIMIT`, 40) rather than at the interactive
        default.  `total` is the target's real row count, so a client pages on
        from `count` with `/api/functions`.
      responses:
        "200":
          description: The target list and the first target's data.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Vary: { $ref: "#/components/headers/Vary" }
            Server-Timing: { $ref: "#/components/headers/ServerTiming" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bootstrap" }
        "304": { $ref: "#/components/responses/NotModified" }
        "403": { $ref: "#/components/responses/HostNotAllowed" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/DatabaseError" }
        "503": { $ref: "#/components/responses/ServerBusy" }
    head:
      tags: [database]
      operationId: headBootstrap
      summary: Headers for the bootstrap payload.
      responses:
        "200":
          description: The target list and the first target's data.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Vary: { $ref: "#/components/headers/Vary" }
            Server-Timing: { $ref: "#/components/headers/ServerTiming" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bootstrap" }
        "304": { $ref: "#/components/responses/NotModified" }
        "403": { $ref: "#/components/responses/HostNotAllowed" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/DatabaseError" }
        "503": { $ref: "#/components/responses/ServerBusy" }

  /api/summary:
    get:
      tags: [database]
      operationId: getSummary
      summary: Coverage stats for one target.
      description: |
        `function_stats` is derived from the document's own function rows when
        it is read, so every aggregate is an integer by construction;
        `coverage_pct` and `identified_pct` are computed from it.
      parameters:
        - $ref: "#/components/parameters/Target"
      responses:
        "200":
          description: The target's stats.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Vary: { $ref: "#/components/headers/Vary" }
            Server-Timing: { $ref: "#/components/headers/ServerTiming" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/MissingTarget" }
        "403": { $ref: "#/components/responses/HostNotAllowed" }
        "404": { $ref: "#/components/responses/UnknownTarget" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/DatabaseError" }
        "503": { $ref: "#/components/responses/ServerBusy" }
    head:
      tags: [database]
      operationId: headSummary
      summary: Headers for one target's stats.
      parameters:
        - $ref: "#/components/parameters/Target"
      responses:
        "200":
          description: The target's stats.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Vary: { $ref: "#/components/headers/Vary" }
            Server-Timing: { $ref: "#/components/headers/ServerTiming" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/MissingTarget" }
        "403": { $ref: "#/components/responses/HostNotAllowed" }
        "404": { $ref: "#/components/responses/UnknownTarget" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/DatabaseError" }
        "503": { $ref: "#/components/responses/ServerBusy" }

  /api/functions:
    get:
      tags: [database]
      operationId: getFunctions
      summary: Paged function rows for one target.
      description: |
        Ordered by virtual address.  `q` matches name or symbol, and also
        matches the address exactly when it is a hex number of four or more
        digits (`0x401000` and `00401000` name the same address).
      parameters:
        - $ref: "#/components/parameters/Target"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Module"
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: One page of function rows.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Vary: { $ref: "#/components/headers/Vary" }
            Server-Timing: { $ref: "#/components/headers/ServerTiming" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Functions" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/HostNotAllowed" }
        "404": { $ref: "#/components/responses/UnknownTarget" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/DatabaseError" }
        "503": { $ref: "#/components/responses/ServerBusy" }
    head:
      tags: [database]
      operationId: headFunctions
      summary: Headers for one page of function rows.
      parameters:
        - $ref: "#/components/parameters/Target"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Module"
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: One page of function rows.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Vary: { $ref: "#/components/headers/Vary" }
            Server-Timing: { $ref: "#/components/headers/ServerTiming" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Functions" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/HostNotAllowed" }
        "404": { $ref: "#/components/responses/UnknownTarget" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/DatabaseError" }
        "503": { $ref: "#/components/responses/ServerBusy" }

  /api/sections:
    get:
      tags: [database]
      operationId: getSections
      summary: Per-section cell counts for one target.
      description: |
        Unpaged: the section list is 1:1 on its key and small enough to send
        whole, so the envelope reports `paged: false` and `limit` is the row
        count.  `limit`/`offset` are not accepted here.
      parameters:
        - $ref: "#/components/parameters/Target"
      responses:
        "200":
          description: Every section row.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Vary: { $ref: "#/components/headers/Vary" }
            Server-Timing: { $ref: "#/components/headers/ServerTiming" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sections" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/MissingTarget" }
        "403": { $ref: "#/components/responses/HostNotAllowed" }
        "404": { $ref: "#/components/responses/UnknownTarget" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/DatabaseError" }
        "503": { $ref: "#/components/responses/ServerBusy" }
    head:
      tags: [database]
      operationId: headSections
      summary: Headers for the section rows.
      parameters:
        - $ref: "#/components/parameters/Target"
      responses:
        "200":
          description: Every section row.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Vary: { $ref: "#/components/headers/Vary" }
            Server-Timing: { $ref: "#/components/headers/ServerTiming" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sections" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/MissingTarget" }
        "403": { $ref: "#/components/responses/HostNotAllowed" }
        "404": { $ref: "#/components/responses/UnknownTarget" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/DatabaseError" }
        "503": { $ref: "#/components/responses/ServerBusy" }

  /api/globals:
    get:
      tags: [database]
      operationId: getGlobals
      summary: Paged global data rows for one target, ordered by address.
      description: |
        Ordered by address.  `q` matches the global's name and its address
        exactly; unlike `/api/functions`, a global carries no linkage symbol,
        so there is no second text column to match.
      parameters:
        - $ref: "#/components/parameters/Target"
        - $ref: "#/components/parameters/Module"
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: One page of global rows.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Vary: { $ref: "#/components/headers/Vary" }
            Server-Timing: { $ref: "#/components/headers/ServerTiming" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Globals" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/MissingTarget" }
        "403": { $ref: "#/components/responses/HostNotAllowed" }
        "404": { $ref: "#/components/responses/UnknownTarget" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/DatabaseError" }
        "503": { $ref: "#/components/responses/ServerBusy" }
    head:
      tags: [database]
      operationId: headGlobals
      summary: Headers for one page of global rows.
      parameters:
        - $ref: "#/components/parameters/Target"
        - $ref: "#/components/parameters/Module"
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: One page of global rows.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Vary: { $ref: "#/components/headers/Vary" }
            Server-Timing: { $ref: "#/components/headers/ServerTiming" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Globals" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/MissingTarget" }
        "403": { $ref: "#/components/responses/HostNotAllowed" }
        "404": { $ref: "#/components/responses/UnknownTarget" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/DatabaseError" }
        "503": { $ref: "#/components/responses/ServerBusy" }

  /api/history:
    get:
      tags: [database]
      operationId: getHistory
      summary: Paged status-change history for one target, newest first.
      description: |
        `old_status` and `new_status` are `""` for a VA's first recorded
        transition, where the document stores no value.
      parameters:
        - $ref: "#/components/parameters/Target"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: One page of history rows.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Vary: { $ref: "#/components/headers/Vary" }
            Server-Timing: { $ref: "#/components/headers/ServerTiming" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/History" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/MissingTarget" }
        "403": { $ref: "#/components/responses/HostNotAllowed" }
        "404": { $ref: "#/components/responses/UnknownTarget" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/DatabaseError" }
        "503": { $ref: "#/components/responses/ServerBusy" }
    head:
      tags: [database]
      operationId: headHistory
      summary: Headers for one page of history rows.
      parameters:
        - $ref: "#/components/parameters/Target"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: One page of history rows.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Vary: { $ref: "#/components/headers/Vary" }
            Server-Timing: { $ref: "#/components/headers/ServerTiming" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/History" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/MissingTarget" }
        "403": { $ref: "#/components/responses/HostNotAllowed" }
        "404": { $ref: "#/components/responses/UnknownTarget" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/DatabaseError" }
        "503": { $ref: "#/components/responses/ServerBusy" }

components:
  parameters:
    Target:
      name: target
      in: query
      required: true
      description: |
        The target name, as listed by `/api/targets`.  Missing or blank is
        400 `missing_target`; a name with no stats row is 404
        `unknown_target`.  A repeated parameter takes its first value.
      schema: { type: string, minLength: 1 }
    Status:
      name: status
      in: query
      required: false
      description: |
        A match status, matched case-insensitively and trimmed.  `UNKNOWN`
        is the coverage document's default for a function with no STATUS, and is
        accepted because the summary renders it as a filterable card.  A value
        outside the schema below is 400 `invalid_status` rather than an empty
        page, which would read as "this target has no functions in that
        status".  A blank value (`status=`) does not filter, like omitting it.
        A repeated parameter takes its first value.
      schema:
        anyOf:
          - $ref: "#/components/schemas/FilterStatus"
          - $ref: "#/components/schemas/StatusAlias"
    Module:
      name: module
      in: query
      required: false
      description: |
        A module name as stored.  Omitting it does not filter; a *present*
        empty value (`module=`) matches rows with a blank module.  The value
        is trimmed first, so a whitespace-only value is that same blank-module
        filter.  It is compared for equality, so `%` and `_` in it are ordinary
        characters and need no escaping.  A repeated parameter takes its
        first value.
      schema: { type: string }
    Query:
      name: q
      in: query
      required: false
      description: |
        A case-insensitive substring of the row's name (and symbol, on
        functions).  A hex number of four or more digits, with or without a
        `0x` prefix, also matches that virtual address exactly.  LIKE
        wildcards are escaped.  Surrounding whitespace is trimmed, so a blank
        value is no filter, like omitting it.  A repeated parameter takes its
        first value.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      description: |
        Page size.  Missing, empty, non-numeric, or non-positive falls back
        to 100; larger values clamp to 5000.  The applied value is read back
        from the envelope's `limit`.
      schema: { type: integer, minimum: 1, maximum: 5000, default: 100 }
    Offset:
      name: offset
      in: query
      required: false
      description: |
        Rows to skip.  Missing, empty, non-numeric, or negative falls back to
        0; values past the address ceiling (`VA_MAX`) clamp to it, so an
        oversized skip is an empty page rather than a 500.  Read back from
        `offset`.
      schema: { type: integer, minimum: 0, default: 0 }
    CacheBuster:
      name: v
      in: query
      required: false
      description: |
        The script's content hash.  The shell links the scripts at
        `?v=<content hash>`, and that exact value is the one served
        `immutable`; any other value revalidates.
      schema: { type: string }

  schemas:
    FilterStatus:
      type: string
      description: |
        The match statuses a stored function row can hold, which is exactly
        the set every status card in the summary can be filtered by.
        `NEAR_MATCH` is accepted too (see `StatusAlias`); it is listed apart
        so the vocabulary stays checkable against the stored rows.
      enum:
        - EXACT
        - RELOC
        - PROVEN
        - NEAR_MATCHING
        - STUB
        - SKIP
        - UNKNOWN
        - INVALID_VA
        - MISSING_FILE
        - MISSING_SIZE
        - SIZE_MISMATCH
        - COMPILE_ERROR
        - EXTRACT_ERROR
    StatusAlias:
      type: string
      description: |
        The legacy spelling of `NEAR_MATCHING`, accepted on request and
        canonicalised to `NEAR_MATCHING` before the filter runs.  Rows are
        never stored under it, so a response never carries it.
      const: NEAR_MATCH

    Error:
      type: object
      description: |
        The one error envelope.  Branch on `code`; `error` is prose for a
        human reader and is not a stable contract.
      required: [error, code]
      properties:
        error:
          type: string
          description: Human-readable reason for the failure.
        code:
          $ref: "#/components/schemas/ErrorCode"
      examples:
        - error: "unknown target 'server_dll2'"
          code: unknown_target

    ErrorCode:
      type: string
      description: |
        Stable machine-readable code.  A client should branch on this, never
        on `error` or on the message text.
      enum:
        - missing_target
        - unknown_target
        - invalid_status
        - not_found
        - method_not_allowed
        - host_not_allowed
        - database_error
        - internal_error
        - server_busy
        - bad_request
        - uri_too_long
        - header_fields_too_large
        - http_version_not_supported
        - request_error

    ListMeta:
      type: object
      description: |
        The envelope every list response carries.  `count` is the rows in
        this page, `total` the rows matching the filter, and `limit`/
        `offset` the *applied* values, not the requested ones.
      required: [target, count, total, limit, offset, paged]
      properties:
        target: { type: string }
        count: { type: integer, minimum: 0, description: Rows in this page. }
        total: { type: integer, minimum: 0, description: Rows matching the filter. }
        limit: { type: integer, minimum: 0, description: Applied page size (the row count where `paged` is false). }
        offset: { type: integer, minimum: 0, description: Applied skip. }
        paged:
          type: boolean
          description: |
            Whether `limit` is a page size.  True on `/api/functions`,
            `/api/globals`, and `/api/history`; false where the whole
            collection is sent, in which case `limit` is the row count and
            `offset` is 0.

    Targets:
      type: object
      description: "The target list envelope.  It carries no `target` field, since it names no one target."
      required: [targets, count, total, limit, offset, paged]
      properties:
        targets:
          type: array
          items: { type: string }
        count: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
        paged: { type: boolean, const: false }

    Bootstrap:
      type: object
      description: |
        The `/api/targets` envelope, widened with the first target's summary
        and first page of functions.
      required: [targets, count, total, limit, offset, paged, target, summary, functions]
      properties:
        targets:
          type: array
          items: { type: string }
        count: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
        paged: { type: boolean, const: false }
        target:
          type: [string, "null"]
          description: The first target, or null when the directory has none.
        summary:
          oneOf:
            - $ref: "#/components/schemas/Summary"
            - type: "null"
          description: Null when there is no target.
        functions:
          oneOf:
            - $ref: "#/components/schemas/Functions"
            - type: "null"
          description: Null under the same conditions as `summary`.

    Health:
      type: object
      description: |
        Liveness plus one real read of the target list.  The running totals
        are there so a probe can watch the error rate while the
        server is up, rather than learning of a run that fails every query
        only when the process stops.
      required: [status, targets, requests, server_errors, slowest_ms, active_connections]
      properties:
        status: { type: string, const: ok }
        coverage_dir:
          type: string
          description: >-
            Absolute path of the coverage directory being served.  Absent when
            the bound host is not a loopback address: the path names the
            analyst's own disk layout and a LAN client has no use for it, so it
            is withheld exactly where exposing it would be a disclosure.
        targets: { type: integer, minimum: 0, description: Readable coverage documents in that directory. }
        requests: { type: integer, minimum: 0, description: Requests served since the server started. }
        server_errors:
          type: integer
          minimum: 0
          description: >-
            5xx responses, including a connection refused by the in-flight cap,
            and unhandled handler faults since the server started.
        slowest_ms:
          type: number
          minimum: 0
          description: Slowest request handled since the server started, in milliseconds.
        active_connections:
          type: integer
          minimum: 0
          description: >-
            Connections currently holding a handler thread, the count the
            in-flight cap refuses on. A gauge, not a running total: it rises
            and falls with the clients connected right now.

    Summary:
      type: object
      required: [target, function_stats, coverage_pct, identified_pct]
      properties:
        target: { type: string }
        function_stats:
          type: object
          description: |
            The summary aggregate, derived from the document's stored function
            rows every time it is read: `total` (code rows), `matched_bytes`
            (`EXACT`/`RELOC`), `covered_bytes` (every function, stubs
            included), `total_bytes` (the `.text` section size), `by_status`
            and `by_module_counts` (both with sorted keys).  Every byte count
            is a non-negative integer by construction: one past `total_bytes`
            is capped and logged, never served.  `coverage_pct` and
            `identified_pct` are `matched_bytes` and `covered_bytes` over
            `total_bytes`, each floored.
          additionalProperties: true
        coverage_pct:
          type: number
          description: Byte-matched bytes (`EXACT`/`RELOC`) over total bytes, floored.
        identified_pct:
          type: number
          description: Identified bytes, stubs included, over total bytes, floored.

    Functions:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [cols, functions]
          properties:
            cols:
              type: array
              description: Column names, positionally labelling every row in `functions`.
              items: { type: string }
              const: [va, name, symbol, size, status, module, files]
            functions:
              type: array
              items:
                type: array
                prefixItems:
                  - { $ref: "#/components/schemas/Va" }
                  - { type: string, description: Function name, or "" when unnamed. }
                  - { type: string, description: Linkage symbol, or "". }
                  - { type: [integer, "null"], minimum: 0, description: Size in bytes. }
                  - { type: string, description: Match status, or "". }
                  - { type: string, description: Module, or "" when unset. }
                  - { type: string, description: Source files, comma-separated, or "". }
                minItems: 7
                maxItems: 7

    Sections:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [cols, sections]
          properties:
            cols:
              type: array
              items: { type: string }
              const:
                - name
                - size
                - total_cells
                - exact
                - reloc
                - near_match
                - stub
                - proven
                - size_mismatch
                - thunk
                - data
                - padding
                - none
                - other
            sections:
              type: array
              items:
                type: array
                prefixItems:
                  - { type: string, description: Section name. }
                  - { type: [integer, "null"], minimum: 0, description: Section size in bytes. }
                  - { type: [integer, "null"], minimum: 0, description: Cells in the section. }
                  - { type: integer, minimum: 0 }
                  - { type: integer, minimum: 0 }
                  - { type: integer, minimum: 0 }
                  - { type: integer, minimum: 0 }
                  - { type: integer, minimum: 0 }
                  - { type: integer, minimum: 0 }
                  - { type: integer, minimum: 0 }
                  - { type: integer, minimum: 0 }
                  - { type: integer, minimum: 0 }
                  - { type: integer, minimum: 0 }
                  - { type: integer, minimum: 0 }
                minItems: 14
                maxItems: 14

    Globals:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [cols, globals]
          properties:
            cols:
              type: array
              items: { type: string }
              const: [va, name, decl, size, module]
            globals:
              type: array
              items:
                type: array
                prefixItems:
                  - { $ref: "#/components/schemas/Va" }
                  - { type: string }
                  - { type: string, description: Declaration text, or "". }
                  - { type: integer, minimum: 0, description: Size in bytes; the column is NOT NULL. }
                  - { type: string, description: Module, or "" when unset. }
                minItems: 5
                maxItems: 5

    History:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          required: [cols, history]
          properties:
            cols:
              type: array
              items: { type: string }
              const: [va, name, old_status, new_status, changed_at]
            history:
              type: array
              items:
                type: array
                prefixItems:
                  - { $ref: "#/components/schemas/Va" }
                  - { type: string, description: Current function name, or "" if the row is gone. }
                  - { type: string, description: Previous status, or "" for a VA's first transition. }
                  - { type: string }
                  - type: string
                    format: date-time
                    minLength: 1
                    description: |
                      UTC instant of the change, as an RFC 3339 timestamp.  The
                      column is NOT NULL and may not be empty, so a client
                      never has to null-check this column.
                minItems: 5
                maxItems: 5

    Va:
      type: string
      description: |
        Virtual address as `0x` plus at least eight lowercase hex digits, or
        `???` when the row holds no address.  A 32-bit target pads to
        eight; an address above `0xffffffff` keeps every digit it has, up to
        the 16 the int64 range allows.
      pattern: '^(0x[0-9a-f]{8,16}|\?\?\?)$'

  responses:
    HtmlOk:
      description: The shell.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        Vary: { $ref: "#/components/headers/Vary" }
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        text/html:
          schema: { type: string }

    ScriptOk:
      description: A script.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        Vary: { $ref: "#/components/headers/Vary" }
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/javascript:
          schema: { type: string }

    FaviconOk:
      description: The mark.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        Vary: { $ref: "#/components/headers/Vary" }
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        image/svg+xml:
          schema: { type: string }

    MissingTarget:
      description: |
        `target` is missing or blank (`missing_target`).  `/api/functions`
        answers this status for a missing `target` as well as for a bad
        `status`, so branch on `code` rather than on the route.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    InvalidRequest:
      description: |
        `/api/functions` rejects a query parameter outside its vocabulary
        (`invalid_status`).  The same status also covers a missing or blank
        `target` (`missing_target`), so branch on `code`: `invalid_status`
        names the offending value, `missing_target` names the absent one.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    UnknownTarget:
      description: |
        No target by that name has stats (`unknown_target`).  A path the
        server does not serve answers this same status with `not_found`
        whatever the method, since there is no resource to list methods for.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    NotModified:
      description: |
        The client's `If-None-Match` matched this representation, so the
        route never ran.  The body is empty; revalidate the same URL to get
        one.  Never sent by `/api/health`, which carries no validator.

        Only sent when the same request would answer 200: a target-scoped
        route needs a known `target`, `/api/summary` a readable
        `function_stats`, and `/api/functions` a `status` inside the
        vocabulary.  A request that would be rejected keeps its 400 or 404
        instead, so a held validator never hides a rejected query.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        Vary: { $ref: "#/components/headers/Vary" }
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }

    HostNotAllowed:
      description: |
        The request's `Host` header is neither the bound host nor one of its
        loopback aliases, so it is refused with `host_not_allowed` before it
        is routed.  This is the DNS-rebinding guard: it is what keeps a page
        the analyst is visiting from reaching the dashboard.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    MethodNotAllowed:
      description: |
        A method other than `GET`/`HEAD` on a path this server serves
        (`method_not_allowed`).  Nothing here writes, so no other verb has
        a resource to act on.  A path the server does not serve answers 404
        `not_found` whatever the method, since there is no resource to list
        methods for.
      headers:
        Allow:
          description: 'The methods this resource serves: `GET, HEAD`.'
          schema: { type: string }
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    DatabaseError:
      description: |
        A server-side failure the client cannot fix, in the `Error`
        envelope: `database_error` when the coverage directory yielded no
        readable document, `internal_error` for any other fault in a route.  A client
        that cannot branch any finer treats every 500 alike and retries
        later; the `code` is what distinguishes them.
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    ServerBusy:
      description: |
        The connection cap was full when this one arrived
        (`server_busy`), so it is answered and closed without a handler and
        without running the route.  Unlike every other status here, this one
        costs nothing to retry: a slot frees when the client that holds it
        closes its keep-alive connection, and `Retry-After` says how long to
        wait for that.  A client that keeps retrying without waiting gets the
        same answer every time.
      headers:
        Retry-After:
          description: 'Seconds to wait before reconnecting.'
          schema: { type: string }
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  headers:
    ETag:
      description: |
        Validator for this exact representation.  `/` and the two scripts
        carry a strong content hash; the JSON routes carry a weak tag over
        every coverage document's name, mtime and size *and* the request's
        path and query, so a validator held for one route, target, or filter
        never stands for another, and a `build-db` of any target moves it.
        Absent on `/api/health`.
      schema: { type: string }
    CacheControl:
      description: |
        `private, no-cache` on a revalidated response, `no-store` on
        `/api/health` and on every error, and
        `private, max-age=31536000, immutable` on a script at its `?v=`
        content-hash URL.
      schema: { type: string }
    Vary:
      description: '`Accept-Encoding`; the body is served zstd or gzip.'
      schema: { type: string }
    ServerTiming:
      description: |
        `route;dur=<ms>`, the server time the route itself took, so a
        client can separate query time from transfer time.  Absent on the
        entry assets (`/` and `/app.js`), whose cold
        flight is budgeted against the initial congestion window and would
        read as a constant anyway.  Absent on every error and on 304.
      schema: { type: string }
    XRequestId:
      description: |
        `r<N>`, this request's correlation id, on every response: 200, 304,
        403, 405, and 5xx alike.  It is the id the access and error log
        lines carry, so a reported failure is one grep away.
      schema: { type: string }

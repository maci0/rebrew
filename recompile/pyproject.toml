[project]
name = "recompile"
version = "0.1.0"
description = "recompile.online — compiler-as-a-service API over the rebrew toolchain zoo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "rebrew>=0.1.0",
    "uvicorn>=0.30",
]

[project.scripts]
recompile-api = "recompile.app:main"

[tool.setuptools.packages.find]
include = ["recompile*"]

[tool.uv.sources]
rebrew = { path = ".." }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pin the uv installer so CI does not drift with setup-uv's default "latest".
# Bump deliberately when upgrading the local toolchain (see `uv --version`).
# RESEMBL_REF must match the `resembl` version recorded in uv.lock (path dep).
# Third-party Actions are commit-SHA pinned (mutable tags can be retargeted);
# Dependabot's github-actions group refreshes the SHAs weekly.
env:
  UV_VERSION: "0.12.14"
  RESEMBL_REF: "v2.0.0"
  # typer renders every --help with ANSI codes whenever GITHUB_ACTIONS is set
  # (it treats the GitHub log renderer as a color terminal), which splits
  # option names across escape sequences and breaks every assertion on help
  # text: the help-listing tests, the SKILL.md validator, and the
  # cli-contract grep.  This is typer's own switch for turning that off.
  _TYPER_FORCE_DISABLE_TERMINAL: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out sibling resembl (path dependency of the `similarity` group)
        # [tool.uv.sources] resolves `resembl` from ../resembl, so every uv
        # sync needs the sibling present even when the group is not installed.
        # actions/checkout refuses to write outside the workspace, so clone
        # RESEMBL_REF (must match uv.lock) into the parent directory — the
        # same layout a developer's checkout has.
        run: git clone --depth 1 --branch "${{ env.RESEMBL_REF }}" https://github.com/maci0/resembl.git ../resembl
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"
      - name: Install dependencies
        # --all-extras matters for mypy: prove.py's angr/SimProcedure stubs
        # only type-check correctly with angr installed (otherwise mypy
        # reports phantom unused-ignore / Any-subclass errors).
        # --group similarity installs the sibling resembl path dep (not a
        # PyPI extra — see pyproject.toml [dependency-groups]).
        run: uv sync --frozen --all-extras --group similarity
      - name: Ruff lint
        run: uv run ruff check src/ tests/ tools/
      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ tools/
      - name: Mypy type check
        run: uv run mypy
      - name: Dependency vulnerability audit
        # Advisory gate: `uv audit` exits 1 on known-vulnerable packages
        # (deps-review F1 — the lock previously pinned 35 CVEs and --frozen
        # CI re-pinned them forever).  diskcache's unsafe-pickle advisory
        # (GHSA-w8v5-vhqr-4h9v) is ignored only while unfixed: the cache
        # stores only compiled .obj bytes, never untrusted input, and a
        # fixed release flips this step red to force the upgrade.
        run: uv audit --locked --ignore-until-fixed GHSA-w8v5-vhqr-4h9v

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out sibling resembl (path dependency of the `similarity` group)
        # See the lint job: [tool.uv.sources] resolves `resembl` from ../resembl.
        run: git clone --depth 1 --branch "${{ env.RESEMBL_REF }}" https://github.com/maci0/resembl.git ../resembl
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen --all-extras --group similarity
      - name: Install nasm (NASM round-trip verification in asm tests)
        # apt mirrors flake under load; retry update before failing the job.
        run: |
          set -euo pipefail
          if command -v nasm >/dev/null 2>&1; then
            nasm -v
            exit 0
          fi
          for attempt in 1 2 3; do
            if sudo apt-get update -qq; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "apt-get update failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nasm
          nasm -v
      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
      - name: Fixture freshness (checked-in fixtures match the generator)
        run: uv run python tools/gen_fixtures.py --check
      - name: Idempotency sweep (every --json command, run twice)
        run: uv run python tools/check_idempotency.py --fixture-dir .scratch/rebrew-idem

  # Pre-commit hook parity: run the repo's own hook set (hygiene + ruff + mypy,
  # plus import-cycle and skills checks) against a clean checkout. The pytest
  # hook is pre-push stage only, so this job does not duplicate the suite.
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out sibling resembl (path dependency of the `similarity` group)
        # See the lint job: [tool.uv.sources] resolves `resembl` from ../resembl.
        run: git clone --depth 1 --branch "${{ env.RESEMBL_REF }}" https://github.com/maci0/resembl.git ../resembl
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --frozen --all-extras --group similarity
      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files

  # Package build: prove sdist/wheel build from a clean tree, install the wheel
  # (not the editable src tree), and smoke-import. SOURCE_DATE_EPOCH + C/UTC
  # make wheels byte-reproducible for a given commit.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          # Explicit pin (matches .python-version): do not float with the
          # runner image if the checkout file is ever absent.
          python-version: "3.13"
      - name: Build sdist and wheel
        env:
          TZ: UTC
          LC_ALL: C
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          uv build
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [[ ${#wheels[@]} -ne 1 || ${#sdists[@]} -ne 1 ]]; then
            echo "expected exactly one wheel and one sdist in dist/" >&2
            ls -la dist/ || true
            exit 1
          fi
          ls -la dist/
      - name: Generate CycloneDX SBOM from uv.lock
        # Offline inventory for consumers/scanners.  tools/generate_sbom.py is
        # stdlib-only so the package job does not need a prior `uv sync`.
        run: |
          set -euo pipefail
          python3 tools/generate_sbom.py -o dist/rebrew.cdx.json
          python3 -c "import json,sys; d=json.load(open('dist/rebrew.cdx.json')); assert d['bomFormat']=='CycloneDX'; assert len(d['components'])>10; print(len(d['components']), 'components')"
      - name: Verify wheel reproducibility (second clean build)
        # The wheel must be byte-identical across builds of the same commit:
        # --no-cache + a fresh out-dir forces a real second build (no cache
        # hit), and the same SOURCE_DATE_EPOCH must yield the same hash.
        # The sdist is excluded — setuptools leaves entry mtimes unnormalized
        # (documented Makefile limitation; wheels are the reproducibility
        # contract).
        env:
          TZ: UTC
          LC_ALL: C
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail
          shopt -s nullglob
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          first_sha=$(sha256sum dist/*.whl | cut -d' ' -f1)
          uv build --wheel --no-cache --out-dir dist-repro 2>&1 | tail -1
          second_sha=$(sha256sum dist-repro/*.whl | cut -d' ' -f1)
          if [[ "$first_sha" != "$second_sha" ]]; then
            echo "::error::wheel is not reproducible (first=$first_sha second=$second_sha)" >&2
            exit 1
          fi
          echo "wheel reproducible: $first_sha"
      - name: Install wheel into clean venv and smoke-import
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          uv venv .venv-pkg
          uv pip install --python .venv-pkg "${wheels[0]}"
          .venv-pkg/bin/python -c "from importlib.metadata import version; import rebrew; print(version('rebrew'))"
          .venv-pkg/bin/rebrew --help >/dev/null
          .venv-pkg/bin/python -c "from pathlib import Path; import rebrew; p=Path(rebrew.__file__).parent; assert (p/'agent-skills').is_dir(), p; assert (p/'AGENTS.md.template').is_file(); assert (p/'PRINCIPLES.md').is_file()"

  # Contract smoke: CLI surfaces for the high-value gates documented in docs/CI.md.
  # These do not require a target binary: only that the options exist and help text
  # matches the public contract. Full verify/round-trip runs live in workspace CI.
  cli-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out sibling resembl (path dependency of the `similarity` group)
        # See the lint job: [tool.uv.sources] resolves `resembl` from ../resembl.
        run: git clone --depth 1 --branch "${{ env.RESEMBL_REF }}" https://github.com/maci0/resembl.git ../resembl
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"
      - name: Install package
        run: uv sync --frozen
      - name: CLI contract (round-trip / verify flags)
        run: |
          set -euo pipefail
          # grep -q closes the pipe on match → SIGPIPE → pipefail fails even on
          # success; consume all input and discard output instead.
          uv run rebrew round-trip --help | grep -- '--strict-catalog' >/dev/null
          uv run rebrew verify --help | grep -- '--compare' >/dev/null
          uv run rebrew prove --help | grep 'NEAR_MATCHING' >/dev/null

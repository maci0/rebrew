name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The Actions cache (setup-uv enable-cache) authenticates with the runner's
# own token, not GITHUB_TOKEN, so no `actions` grant is needed to save it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR updates supersede the previous run. A push to main must finish:
  # the package job uploads rebrew-dist-<sha>, and cancelling drops that
  # commit's verified wheel, sdist, SBOM, and buildinfo.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# uv / Python / resembl pins and the shared setup steps live in one place:
# .github/actions/uv-env/action.yml (used by both workflows).
# Third-party Actions are commit-SHA pinned (mutable tags can be retargeted);
# Dependabot's github-actions group refreshes the SHAs weekly.
env:
  # typer renders every --help with ANSI codes whenever GITHUB_ACTIONS is set
  # (it treats the GitHub log renderer as a color terminal), which splits
  # option names across escape sequences and breaks every assertion on help
  # text: the help-listing tests, the SKILL.md validator, and the
  # cli-contract grep.  This is typer's own switch for turning that off.
  _TYPER_FORCE_DISABLE_TERMINAL: "1"
  # GH_TOKEN is NOT workflow-wide: map secrets.GITHUB_TOKEN only onto the
  # resembl-clone steps below so pytest/ruff/mypy never see the token.

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and the sibling resembl checkout
        # Default python-version is the exact .python-version patch (hermetic
        # lint; do not float).
        uses: ./.github/actions/uv-env
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        # --all-extras matters for mypy: prove.py's angr/SimProcedure stubs
        # only type-check correctly with angr installed (otherwise mypy
        # reports phantom unused-ignore / Any-subclass errors).
        # --group similarity installs the sibling resembl path dep (not a
        # PyPI extra — see pyproject.toml [dependency-groups]).
        run: uv sync --frozen --all-extras --group similarity
      # Gates call the Makefile targets so local `make all` and CI run the
      # same command lines (the audit ignore list lives only there).
      - name: Ruff lint
        run: make lint
      - name: Ruff format check
        run: make format-check
      - name: Mypy type check
        run: make mypy
      - name: Dependency vulnerability audit
        # Blocking gate: `uv audit` exits 1 on known-vulnerable packages, so
        # --frozen CI cannot keep re-pinning a vulnerable lock.  diskcache's
        # unsafe-pickle advisory (GHSA-w8v5-vhqr-4h9v) is ignored only while
        # unfixed: the cache
        # stores only compiled .obj bytes, never untrusted input, and a
        # fixed release flips this step red to force the upgrade.
        run: make audit

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.13 entry = exact .python-version patch (it runs the coverage gate);
        # 3.14 floats on its minor for forward-compat coverage.
        python-version: ["3.13.15", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Packaging tests run `git describe` and `git show <tag>:file`.
          # A depth-1 fetch with tags still leaves the tag commit off the
          # ancestry of HEAD, so describe fails. Full history keeps it.
          fetch-depth: 0
          fetch-tags: true
      - name: Set up uv and the sibling resembl checkout
        uses: ./.github/actions/uv-env
        with:
          python-version: ${{ matrix.python-version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: uv sync --frozen --all-extras --group similarity
      - name: Install nasm (NASM round-trip verification in asm tests)
        # apt mirrors flake under load; retry update and install before failing the job.
        run: |
          set -euo pipefail
          if command -v nasm >/dev/null 2>&1; then
            nasm -v
            exit 0
          fi
          for attempt in 1 2 3; do
            if sudo apt-get update -qq; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "apt-get update failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          for attempt in 1 2 3; do
            if sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nasm; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "apt-get install nasm failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
            sudo apt-get update -qq || true
          done
          nasm -v
      - name: Run tests
        if: matrix.python-version != '3.13.15'
        run: make test
      - name: Run tests under the coverage floor
        # Same suite as `make test`, plus the COV_FLOOR fail-under gate
        # (AGENTS.md: coverage ratchets). One matrix entry is enough.
        if: matrix.python-version == '3.13.15'
        run: make coverage
      - name: Fixture freshness (checked-in fixtures match the generator)
        run: make gen-fixtures-check
      - name: Idempotency sweep (every --json command, run twice)
        run: make idempotency-check

  # Pre-commit hook parity: run the repo's own hook set (file hygiene,
  # import-cycle and skills checks) against a clean checkout. The ruff and mypy
  # hooks are skipped because the lint job runs the same commands, and the
  # pytest hook is pre-push stage only, so this job duplicates neither.
  pre-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and the sibling resembl checkout
        uses: ./.github/actions/uv-env
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: uv sync --frozen --all-extras --group similarity
      - name: Cache pre-commit hook environments
        # Remote hook repos (pre-commit-hooks) are cloned and installed on
        # first use; the key changes whenever a `rev:` pin does.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-
      - name: Run pre-commit hooks
        env:
          SKIP: ruff-check,ruff-format,mypy
        run: make check

  # Package build: prove sdist/wheel build from a clean tree, install the wheel
  # (not the editable src tree), and smoke-import. SOURCE_DATE_EPOCH + C/UTC
  # make wheels byte-reproducible for a given commit. Smoke deps come from
  # uv.lock (--no-install-project + --no-deps wheel overlay), not live PyPI.
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        # No sibling clone: this job's sync uses --no-default-groups
        # --no-install-project, so the resembl path dep is never resolved.
        uses: ./.github/actions/uv-env
        with:
          clone-resembl: "false"
      - name: Build sdist and wheel
        # Single source of truth with the local contributor path: `make build`
        # owns locale knobs, egg-info cleanup, and dist/rebrew.buildinfo
        # (setuptools pin parsed from pyproject.toml).  Export SOURCE_DATE_EPOCH
        # here so the wheel-repro step below reuses the exact same epoch.
        # Do not re-inline the build recipe — it has drifted before.
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          make build
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [[ ${#wheels[@]} -ne 1 || ${#sdists[@]} -ne 1 ]]; then
            echo "expected exactly one wheel and one sdist in dist/" >&2
            ls -la dist/ || true
            exit 1
          fi
          test -f dist/rebrew.buildinfo
          grep -q "^SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}$" dist/rebrew.buildinfo
          grep -q '^setuptools=' dist/rebrew.buildinfo
          ls -la dist/
      - name: Generate CycloneDX SBOM from uv.lock
        # Offline inventory for consumers/scanners.  `make sbom` owns the
        # command line (`uv run --no-project --offline`): no prior
        # `uv sync` needed, and it still uses the setup-uv Python pin (not the
        # runner's unpinned /usr/bin/python3).
        run: |
          set -euo pipefail
          make sbom
          uv run --no-project --offline python -c "import json,sys; d=json.load(open('dist/rebrew.cdx.json')); assert d['bomFormat']=='CycloneDX'; assert len(d['components'])>10; print(len(d['components']), 'components')"
      - name: Verify wheel and sdist reproducibility (second build, other path)
        # Rebuild the same commit with `make build` from a `git archive` copy
        # at a different path under a different TZ/locale. Extract that copy
        # under umask 077 so its file modes differ from the first checkout
        # (git only stores the executable bit). Both artifacts must be
        # byte-identical: the Makefile pins own path, time, locale, and mode.
        # The copy has no .git, so SOURCE_DATE_EPOCH must come from the env.
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          umask 077
          mkdir ../rebrew-repro
          git archive HEAD | tar -x -C ../rebrew-repro
          TZ=Asia/Tokyo LC_ALL=C.UTF-8 make -C ../rebrew-repro build
          for ext in whl tar.gz; do
            first_sha=$(sha256sum dist/*.$ext | cut -d' ' -f1)
            second_sha=$(sha256sum ../rebrew-repro/dist/*.$ext | cut -d' ' -f1)
            if [[ "$first_sha" != "$second_sha" ]]; then
              echo "::error::$ext is not reproducible (first=$first_sha second=$second_sha)" >&2
              exit 1
            fi
            echo "$ext reproducible: $first_sha"
          done
          rm -rf ../rebrew-repro
      - name: Install wheel into clean venv and smoke-import
        # Hermetic: install runtime deps from uv.lock, then overlay the just-
        # built wheel with --no-deps so a live PyPI resolve cannot drift past
        # the audited lock (uv pip install of a wheel ignores uv.lock).
        # --no-default-groups --no-install-project does not need ../resembl.
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          uv venv .venv-pkg
          UV_PROJECT_ENVIRONMENT=.venv-pkg uv sync --frozen --no-dev --no-default-groups --no-install-project
          uv pip install --python .venv-pkg --no-deps "${wheels[0]}"
          .venv-pkg/bin/python -c "from importlib.metadata import version; import rebrew; print(version('rebrew'))"
          .venv-pkg/bin/rebrew --help >/dev/null
          .venv-pkg/bin/python -c "from pathlib import Path; import rebrew; p=Path(rebrew.__file__).parent; assert (p/'agent-skills').is_dir(), p; assert (p/'AGENTS.md.template').is_file(); assert (p/'PRINCIPLES.md').is_file()"
      - name: Upload package artifacts
        # Retain the verified wheel/sdist/SBOM/buildinfo for the commit (short
        # retention so Actions storage does not accumulate stale builds).
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebrew-dist-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/rebrew.buildinfo
            dist/rebrew.cdx.json
          if-no-files-found: error
          retention-days: 14

  # Contract smoke: CLI surfaces for the high-value gates documented in docs/CI.md.
  # These do not require a target binary: only that the options exist and help text
  # matches the public contract. Full verify/round-trip runs live in workspace CI.
  cli-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and the sibling resembl checkout
        uses: ./.github/actions/uv-env
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install package
        run: uv sync --frozen
      - name: CLI contract (round-trip / verify flags)
        # The Makefile target owns the greps so local `make all` and CI agree.
        run: make cli-contract

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual re-run. The apt and codeload helpers retry three times, so a mirror
  # that stays down past that still fails the job; re-running a failed job
  # cannot pick up a fixed mirror, a new runner image, or a moved resembl tag.
  # This is the same pipeline on the same refs, not a second set of gates.
  workflow_dispatch: {}

# The Actions cache (setup-uv enable-cache) authenticates with the runner's
# own token, not GITHUB_TOKEN, so no `actions` grant is needed to save it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR updates supersede the previous run. A push to main must finish:
  # the package job uploads rebrew-dist-<sha>, and cancelling drops that
  # commit's verified wheel, sdist, SBOM, and buildinfo.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# uv / Python / resembl pins and the shared setup steps live in one place:
# .github/actions/uv-env/action.yml (used by both workflows).
# Third-party Actions are commit-SHA pinned (mutable tags can be retargeted);
# Dependabot's github-actions group refreshes the SHAs weekly.
env:
  # typer renders every --help with ANSI codes whenever GITHUB_ACTIONS is set
  # (it treats the GitHub log renderer as a color terminal), which splits
  # option names across escape sequences and breaks every assertion on help
  # text: the help-listing tests, the SKILL.md validator, and the
  # cli-contract grep.  This is typer's own switch for turning that off.
  _TYPER_FORCE_DISABLE_TERMINAL: "1"
  # GH_TOKEN is NOT workflow-wide: map secrets.GITHUB_TOKEN only onto the
  # resembl-clone steps below so pytest/ruff/mypy never see the token.

jobs:
  lint:
    runs-on: ubuntu-24.04
    # 20, not 10: `uv sync --all-extras` installs the `prove` extra (angr,
    # claripy, pyvex), the largest dependency tree in the lock, and `make
    # audit` is a live PyPI advisory query. On a cold Actions cache that pair
    # is the whole budget, and killing the job mid-`uv sync` reports a gate
    # that has not run yet as a lint failure.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and the sibling resembl checkout
        # Default python-version is the exact .python-version patch (hermetic
        # lint; do not float).
        uses: ./.github/actions/uv-env
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        # --all-extras matters for mypy: prove.py's angr/SimProcedure stubs
        # only type-check correctly with angr installed (otherwise mypy
        # reports phantom unused-ignore / Any-subclass errors).
        # --group similarity installs the sibling resembl path dep (not a
        # PyPI extra — see pyproject.toml [dependency-groups]).
        run: uv sync --locked --all-extras --group similarity
      # Gates call the Makefile targets so local `make all` and CI run the
      # same command lines (the audit ignore list lives only there).
      - name: Ruff lint
        run: make lint
      - name: Ruff format check
        run: make format-check
      - name: Mypy type check
        run: make mypy
      - name: Dependency vulnerability audit
        # Blocking gate: `uv audit` exits 1 on known-vulnerable packages, so
        # --frozen CI cannot keep re-pinning a vulnerable lock.  diskcache's
        # unsafe-pickle advisory (GHSA-w8v5-vhqr-4h9v) is ignored only while
        # unfixed: the cache
        # stores only compiled .obj bytes, never untrusted input, and a
        # fixed release flips this step red to force the upgrade.
        run: make audit

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.13 entry = exact .python-version patch (it runs the coverage gate);
        # 3.14 floats on its minor for forward-compat coverage.
        python-version: ["3.13.15", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Packaging tests run `git describe` and `git show <tag>:file`.
          # A depth-1 fetch with tags still leaves the tag commit off the
          # ancestry of HEAD, so describe fails. Full history keeps it.
          fetch-depth: 0
          fetch-tags: true
      - name: Set up uv and the sibling resembl checkout
        uses: ./.github/actions/uv-env
        with:
          python-version: ${{ matrix.python-version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: uv sync --locked --all-extras --group similarity
      - name: Install nasm (NASM round-trip verification in asm tests)
        # apt mirrors flake under load; the helper retries update and install
        # (same posture as the resembl clone) instead of failing the job.
        run: |
          set -euo pipefail
          bash tools/ci_apt_install.sh nasm
          nasm -v
      - name: Run tests
        if: matrix.python-version != '3.13.15'
        run: make test
      - name: Run tests under the coverage floor
        # Same suite as `make test`, plus the COV_FLOOR fail-under gate
        # (AGENTS.md: coverage ratchets). One matrix entry is enough.
        if: matrix.python-version == '3.13.15'
        run: make coverage
      - name: Fixture freshness (checked-in fixtures match the generator)
        # One matrix entry is enough: both checks read the checked-in tree
        # with tools/ scripts, so their result cannot differ between 3.13 and
        # 3.14. Same posture as the coverage floor above.
        if: matrix.python-version == '3.13.15'
        run: make gen-fixtures-check
      - name: Idempotency sweep (read-only commands and the write commands, run twice)
        if: matrix.python-version == '3.13.15'
        run: make idempotency-check

  # Pre-commit hook parity: run the repo's own hook set (file hygiene,
  # import-cycle and skills checks) against a clean checkout. The ruff and mypy
  # hooks are skipped because the lint job runs the same commands, and the
  # pytest hook is pre-push stage only, so this job duplicates neither.
  pre-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and the sibling resembl checkout
        uses: ./.github/actions/uv-env
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: uv sync --locked --all-extras --group similarity
      - name: Cache pre-commit hook environments
        # Remote hook repos (pre-commit-hooks) are cloned and installed on
        # first use; the key changes whenever a `rev:` pin does.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-
      - name: Install shellcheck
        # The shellcheck hook exits 0 when the binary is absent, so the gate
        # only exists if this step runs. Install explicitly rather than
        # trusting the runner image to keep carrying it, through the same
        # retrying helper the test job installs nasm with.
        run: bash tools/ci_apt_install.sh shellcheck
      - name: Run pre-commit hooks
        env:
          SKIP: ruff-check,ruff-format,mypy
        run: make check

  # Package build: prove sdist/wheel build from a clean tree, install the wheel
  # (not the editable src tree), and smoke-import. SOURCE_DATE_EPOCH + C/UTC
  # make wheels byte-reproducible for a given commit. Smoke deps come from
  # uv.lock (--no-install-project + --no-deps wheel overlay), not live PyPI.
  package:
    runs-on: ubuntu-24.04
    # 30, not 10: this is the only job that produces the release artifact, and
    # it runs five separate build/resolve cycles (sdist, wheel, the
    # `git archive` rebuild's own two, and the wheel built from the sdist),
    # plus a fresh venv for the smoke install and the SBOM generator.  A
    # timeout here kills the run after `concurrency` has already declined to
    # cancel it, so the commit loses its verified wheel rather than failing a
    # gate.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        # No sibling clone: this job's sync uses --no-default-groups
        # --no-install-project, so the resembl path dep is never resolved.
        uses: ./.github/actions/uv-env
        with:
          clone-resembl: "false"
      - name: Build sdist and wheel
        # Single source of truth with the local contributor path: `make build`
        # owns locale knobs, egg-info cleanup, and dist/rebrew.buildinfo
        # (setuptools pin parsed from pyproject.toml).  Export SOURCE_DATE_EPOCH
        # here so the wheel-repro step below reuses the exact same epoch.
        # Do not re-inline the build recipe — it has drifted before.
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          make build
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [[ ${#wheels[@]} -ne 1 || ${#sdists[@]} -ne 1 ]]; then
            echo "expected exactly one wheel and one sdist in dist/" >&2
            ls -la dist/ || true
            exit 1
          fi
          test -f dist/rebrew.buildinfo
          grep -q "^SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}$" dist/rebrew.buildinfo
          grep -q '^setuptools=' dist/rebrew.buildinfo
          # The manifest must name the bytes it ships beside, or nothing binds
          # the provenance to those artifacts.
          grep -q '^wheel-sha256=' dist/rebrew.buildinfo
          grep -q '^sdist-sha256=' dist/rebrew.buildinfo
          grep -q '^uv-lock-sha256=' dist/rebrew.buildinfo
          ls -la dist/
      - name: Verify wheel and sdist reproducibility (second build, other path)
        # Rebuild the same commit with `make build` from a `git archive` copy
        # at a different path under a different TZ/locale. Extract that copy
        # under umask 077 so its file modes differ from the first checkout
        # (git only stores the executable bit). Both artifacts must be
        # byte-identical: the Makefile pins own path, time, locale, and mode.
        # The copy has no .git, so SOURCE_DATE_EPOCH must come from the env.
        # `make build-repro` owns the recipe, like `make build` and
        # `make smoke-wheel` own theirs: inlined here it was a check no
        # contributor could run before pushing, and the drift risk the other
        # two steps call out applies to it too.
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          make build-repro
      - name: Install wheel into clean venv and smoke-import
        # `make smoke-wheel` owns the recipe, the same way `make build` owns
        # the build above: the four commands were inlined here once and the
        # copy drifted from the contributor path. Hermetic by construction —
        # runtime deps come from uv.lock, then the just-built wheel is
        # overlaid with --no-deps so a live PyPI resolve cannot drift past
        # the audited lock (uv pip install of a wheel ignores uv.lock), and
        # --no-default-groups --no-install-project needs no ../resembl.
        # Its `dist/rebrew.buildinfo` prerequisite already exists, so make
        # does not re-run `build` and drop the SBOM the upload requires.
        run: make smoke-wheel
      - name: Verify the sdist ships what the wheel ships
        # The wheel above is smoke-installed; the sdist only gets hashed, and
        # its file list comes from MANIFEST.in plus normalize_sdist.py's
        # post-build rewrite rather than from package-data. A prune rule that
        # drops a runtime file would ship a working wheel and a broken source
        # install. Builds a wheel from the sdist through the same hash-pinned
        # constraints `make build` uses, then diffs the member lists.
        run: make sdist-check
      - name: Generate CycloneDX SBOM from uv.lock
        # Offline inventory for consumers/scanners.  `make sbom` owns the
        # command line (`uv run --no-project --offline`): no prior
        # `uv sync` needed, and it still uses the setup-uv Python pin (not
        # the runner's unpinned /usr/bin/python3).  generate_sbom.py validates
        # the document it emits (format header, spec version, non-empty
        # inventory, a license on every component) and exits 1 otherwise, so a
        # lock that parsed short, or a distribution whose grant is missing
        # from tools/licenses.py, fails the job here instead of shipping a BOM
        # that reads as clean.
        #
        # Last build-touching step on purpose: `make build` clears dist/*.cdx.json
        # so a bumped version cannot leave a stale BOM.  Generating the SBOM
        # before it deleted it again, and the upload below then shipped a
        # wheel, sdist and buildinfo with no BOM while
        # `if-no-files-found: error` stayed green (the other three patterns
        # matched).  `test -s` is the guard for that.
        run: |
          set -euo pipefail
          make sbom
          test -s dist/rebrew.cdx.json
      - name: Upload package artifacts
        # Retain the verified wheel/sdist/SBOM/buildinfo for the commit (short
        # retention so Actions storage does not accumulate stale builds).
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebrew-dist-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/rebrew.buildinfo
            dist/rebrew.cdx.json
          if-no-files-found: error
          retention-days: 14

  # Contract smoke: CLI surfaces for the high-value gates documented in docs/CI.md.
  # These do not require a target binary: only that the options exist and help text
  # matches the public contract. Full verify/round-trip runs live in workspace CI.
  cli-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and the sibling resembl checkout
        uses: ./.github/actions/uv-env
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install package
        run: uv sync --locked
      - name: CLI contract (round-trip / verify flags)
        # The Makefile target owns the greps so local `make all` and CI agree.
        run: make cli-contract

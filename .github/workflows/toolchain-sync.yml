name: toolchain-sync

on:
  schedule:
    - cron: '0 4 * * *'   # nightly upstream-drift check
  workflow_dispatch: {}

permissions:
  contents: read

# Keep in sync with UV_VERSION in ci.yml: one pinned installer everywhere,
# never setup-uv's floating "latest".
env:
  UV_VERSION: "0.12.3"

jobs:
  check-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version-file: ".python-version"
      - name: Install dependencies
        # --frozen installs exactly the audited uv.lock versions; a raw
        # `pip install -e .` here would resolve fresh from PyPI nightly,
        # bypassing review (deps-review F1).
        run: uv sync --frozen
      - name: Check toolchain source drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run rebrew toolchain check-updates
          uv run rebrew toolchain check-updates --json | uv run python -c "import json,sys; d=json.load(sys.stdin); print('drifted:', d['drifted']); sys.exit(1 if d['drifted'] else 0)"

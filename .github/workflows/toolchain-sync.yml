name: toolchain-sync

on:
  schedule:
    - cron: '0 4 * * *'   # nightly upstream-drift check
  workflow_dispatch: {}

permissions:
  contents: read
  # setup-uv enable-cache saves via the Actions cache API; contents:read alone
  # restores but cannot write, so the cache would stay cold forever.
  actions: write

# Keep in sync with UV_VERSION / RESEMBL_REF in ci.yml: one pinned installer
# and one sibling tag everywhere, never setup-uv's floating "latest".
# Third-party Actions are commit-SHA pinned (see ci.yml); Dependabot refreshes.
# GH_TOKEN is mapped only onto the clone + check-updates steps (not workflow-
# wide) so other steps never see secrets.GITHUB_TOKEN.
env:
  UV_VERSION: "0.12.14"
  RESEMBL_REF: "v2.0.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-updates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out sibling resembl (path dependency of the `similarity` group)
        # [tool.uv.sources] resolves `resembl` from ../resembl, so every uv
        # command needs the sibling checkout present even though this job never
        # installs the group.  Keep RESEMBL_REF in step with uv.lock's `resembl`
        # version (see tools/ci_clone_resembl.sh / the clones in ci.yml).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ci_clone_resembl.sh ../resembl
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          # Exact patch matches .python-version (same hermetic pin as ci.yml).
          python-version: "3.13.15"
      - name: Install dependencies
        # --frozen installs exactly the audited uv.lock versions; a raw
        # `pip install -e .` here would resolve fresh from PyPI nightly,
        # bypassing review (deps-review F1).
        run: uv sync --frozen
      - name: Check toolchain source drift
        shell: bash
        env:
          # Authenticated GitHub API rate limits for check-updates.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          result=$(uv run --frozen rebrew toolchain check-updates --json)
          jq . <<< "$result"
          jq -e '
            .drifted == [] and
            (.toolchains | length > 0) and
            all(.toolchains[];
              . == "current" or
              . == "static (immutable release asset)" or
              . == "static (pinned tarball in rebrew-toolchains)"
            )
          ' <<< "$result"

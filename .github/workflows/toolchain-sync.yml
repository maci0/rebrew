name: toolchain-sync

on:
  schedule:
    - cron: '0 4 * * *'   # nightly upstream-drift check
  workflow_dispatch: {}

permissions:
  contents: read

# Keep in sync with UV_VERSION / RESEMBL_REF in ci.yml: one pinned installer
# and one sibling tag everywhere, never setup-uv's floating "latest".
# Third-party Actions are commit-SHA pinned (see ci.yml); Dependabot refreshes.
env:
  UV_VERSION: "0.12.14"
  RESEMBL_REF: "v2.0.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out sibling resembl (path dependency of the `similarity` group)
        # [tool.uv.sources] resolves `resembl` from ../resembl, so every uv
        # command needs the sibling checkout present even though this job never
        # installs the group.  Keep RESEMBL_REF in step with uv.lock's `resembl`
        # version (see the clones in ci.yml).
        run: git clone --depth 1 --branch "${{ env.RESEMBL_REF }}" https://github.com/maci0/resembl.git ../resembl
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"
      - name: Install dependencies
        # --frozen installs exactly the audited uv.lock versions; a raw
        # `pip install -e .` here would resolve fresh from PyPI nightly,
        # bypassing review (deps-review F1).
        run: uv sync --frozen
      - name: Check toolchain source drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run rebrew toolchain check-updates
          uv run rebrew toolchain check-updates --json | uv run python -c "import json,sys; d=json.load(sys.stdin); print('drifted:', d['drifted']); sys.exit(1 if d['drifted'] else 0)"

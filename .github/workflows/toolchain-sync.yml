name: toolchain-sync

on:
  schedule:
    - cron: '0 4 * * *'   # nightly upstream-drift check
  workflow_dispatch: {}

# The Actions cache (setup-uv enable-cache) authenticates with the runner's
# own token, not GITHUB_TOKEN, so no `actions` grant is needed to save it.
permissions:
  contents: read

# uv / Python / resembl pins and the shared setup steps come from
# .github/actions/uv-env — the same ones ci.yml uses, so a scheduled run can
# never resolve a different installer than a PR run.
# Third-party Actions are commit-SHA pinned (see ci.yml); Dependabot refreshes.
# GH_TOKEN is mapped only onto the clone + check-updates steps (not workflow-
# wide) so other steps never see secrets.GITHUB_TOKEN.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer schedule or dispatch replaces a stale drift check. This job
  # uploads nothing keyed by commit, unlike ci.yml's package artifact.
  cancel-in-progress: true

jobs:
  check-updates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and the sibling resembl checkout
        # [tool.uv.sources] resolves `resembl` from ../resembl, so every uv
        # command needs the sibling checkout present even though this job never
        # installs the group.
        uses: ./.github/actions/uv-env
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        # --locked installs exactly the audited uv.lock versions and fails when
        # pyproject.toml has moved past it; a raw `pip install -e .` here would
        # resolve fresh from PyPI nightly, bypassing review.
        run: uv sync --locked
      - name: Install jq (drift result gate)
        # The result gate below parses with jq, so the job needs it before it
        # runs. Install explicitly rather than trusting the runner image to
        # keep carrying it, through the same retrying helper the test job
        # installs nasm with and the pre-commit job installs shellcheck with.
        run: |
          set -euo pipefail
          bash tools/ci_apt_install.sh jq
          jq --version
      - name: Check toolchain source drift
        shell: bash
        env:
          # Authenticated GitHub API rate limits for check-updates.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          result=$(uv run --frozen rebrew toolchain check-updates --json)
          jq . <<< "$result"
          # The statuses a source may report and still pass. Keep in step
          # with rebrew.toolchain_cli's STATUS_* constants:
          # tests/test_ci_pins.py fails when the two drift apart, and the
          # failing branch below names the entries that do not match.
          ok='["current",
                "static (immutable release asset)",
                "static (pinned tarball in rebrew-toolchains)"]'
          if ! jq -e --argjson ok "$ok" '
            .drifted == [] and
            (.toolchains | length > 0) and
            all(.toolchains[]; . as $s | $ok | index($s))
          ' <<< "$result"; then
            offenders=$(jq -r --argjson ok "$ok" '
              .toolchains | to_entries[]
              | select(.value as $s | $ok | index($s) | not)
              | "  \(.key): \(.value)"
            ' <<< "$result")
            if [[ -n "$offenders" ]]; then
              echo "sources that are neither current nor static:" >&2
              echo "$offenders" >&2
            fi
            exit 1
          fi

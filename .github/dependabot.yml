# Weekly bundled update PRs for the pinned GitHub Actions (checkout,
# setup-uv, ...).  Workflows pin Actions by commit SHA; Dependabot refreshes
# those SHAs (and the trailing version comments).  Python dependencies are
# intentionally NOT automated: uv.lock is the audited inventory and
# `uv audit --locked` in CI gates it; bumps land as deliberate
# `uv lock --upgrade` changes.
version: 2
updates:
  - package-ecosystem: github-actions
    # "/" covers .github/workflows/; a composite action in a subdirectory is
    # only scanned when its own directory is listed, and the shared setup-uv
    # pin now lives there.
    directories:
      - /
      - /.github/actions/uv-env
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

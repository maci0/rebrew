# yamllint rules for the tracked YAML (CI workflows, .pre-commit-config.yaml,
# docs/dashboard-api.yaml).  Syntax alone is already gated by the pre-commit
# `check-yaml` hook; this config adds the defect classes that parse as valid
# YAML but break a run: a tab indent, a trailing space, a duplicate key, a
# step whose `run:` block is malformed.
#
# Every setting below matches a convention the tracked files already follow.
# Raise a threshold only after the tree passes it, and record why here.
#
# The hook runs with --strict, so a warning fails like an error.  The one
# file that cannot pass is excluded below rather than demoting the severity
# for the whole tree.
extends: default

ignore: |
  # Reproduces what `splat create_config` emits, and the importer is tested
  # against that output, so the Python-style `True` booleans stay verbatim.
  # The only rules it trips are truthy; dropping this entry fails the hook.
  # The `**/` prefix matters: an ignore entry is matched against the path as
  # given on the command line, so a bare relative path would stop applying the
  # moment a caller passed an absolute one.
  **/splat_config/win32_app.yaml

rules:
  # The tree has no `---` document start: every file opens on its first key.
  document-start: disable

  # `on:` is the GitHub Actions key, not a boolean.  Flagging it is a known
  # YAML 1.1 wart, not a defect in the workflow.
  truthy:
    allowed-values: ["true", "false", "on"]
    check-keys: false

  # Longest tracked line is 103 characters; 120 leaves headroom without
  # exempting a run of unreadable single-line shell in a `run:` block.
  line-length:
    max: 120
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true

  # The OpenAPI spec writes flow mappings with one space inside the braces
  # (`"404": { $ref: ... }`); the default max is 0.
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1

  # Inline comments are written `# text` with one space, matching the shell
  # and Python files.
  comments:
    require-starting-space: true
    min-spaces-from-content: 1

  # Two-space block indentation throughout.
  indentation:
    spaces: 2
    indent-sequences: consistent
